  function gradeAnyContainer(container) {
    let correct = 0, total = 0;
    const bySection = {};
    container.querySelectorAll('.q').forEach(q => {
      const topic = q.dataset.topic;
      const section = q.dataset.section || 'other';
      if (!bySection[section]) bySection[section] = { correct: 0, total: 0 };
      const optEls = q.querySelectorAll('.opt');
      if (optEls.length) {
        total++;
        const answer = parseInt(q.dataset.correct, 10);
        const selected = q.dataset.selected;
        const isCorrect = selected !== undefined && parseInt(selected, 10) === answer;
        if (isCorrect) correct++;
        bySection[section].total++;
        if (isCorrect) bySection[section].correct++;
        recordTopic(topic, isCorrect);
        optEls.forEach(o => {
          o.classList.add('disabled');
          const i = parseInt(o.dataset.i, 10);
          if (i === answer) o.classList.add('correct');
          else if (selected !== undefined && parseInt(selected, 10) === i) o.classList.add('incorrect');
        });
      } else {
        const sentence = q.querySelector('.we-sentence');
        if (sentence) {
          total++;
          const answer = parseInt(sentence.dataset.correct, 10);
          const selected = sentence.dataset.selected;
          const isCorrect = selected !== undefined && parseInt(selected, 10) === answer;
          if (isCorrect) correct++;
          bySection[section].total++;
          if (isCorrect) bySection[section].correct++;
          recordTopic(topic, isCorrect);
          sentence.classList.add('disabled');
          sentence.querySelectorAll('.seg').forEach(s => {
            s.classList.add('disabled');
            const i = parseInt(s.dataset.i, 10);
            if (i === answer) s.classList.add('correct');
            else if (selected !== undefined && parseInt(selected, 10) === i) s.classList.add('incorrect');
          });
        }
      }
      const exp = q.querySelector('.explain');
      if (exp) exp.classList.add('show');
    });
    return { correct, total, bySection };
  }

  async function gradeShortAnswers(container, banner) {
    const fillEls = Array.from(container.querySelectorAll('.fill-q'));
    if (!fillEls.length) return { correct: 0, total: 0, bySection: {} };

    const items = fillEls.map((el, i) => ({
      index: i,
      topic: el.dataset.topic,
      prompt: el.dataset.prompt,
      acceptedAnswer: el.dataset.accepted,
      userAnswer: (el.querySelector('.fill-input').value || '').trim()
    }));

    if (banner) { banner.textContent = 'Grading your typed answers with AI...'; banner.classList.add('show'); }

    let grades = null;
    try {
      const prompt = `You are grading short-answer responses for a TOEFL ITP practice app. For each item, decide if the student's answer is correct given the question and the reference accepted answer. Be reasonably lenient about minor spelling, capitalization, punctuation, or article/word-order variations, but the core grammar point being tested must be correctly demonstrated. Give brief, encouraging feedback (max 20 words) in each case, mentioning what's right or what to fix.

Items (JSON): ${JSON.stringify(items)}

Return ONLY valid JSON, no markdown fences, no commentary, in exactly this shape: {"grades":[{"index":0,"correct":true,"feedback":"..."}]}`;
      const text = await callAI({ prompt, maxTokens: 1500 });
      const clean = text.replace(/```json|```/g, '').trim();
      grades = JSON.parse(clean).grades;
    } catch (e) {
      console.error('Short-answer grading failed', e);
    }

    if (banner) banner.classList.remove('show');

    let correct = 0, total = fillEls.length;
    const bySection = {};
    fillEls.forEach((el, i) => {
      const section = el.dataset.section || 'other';
      if (!bySection[section]) bySection[section] = { correct: 0, total: 0 };
      bySection[section].total++;
      const g = grades && grades.find(x => x.index === i);
      const input = el.querySelector('.fill-input');
      const fb = el.querySelector('.fill-feedback');
      input.disabled = true;
      let isCorrect = false;
      let feedbackText;
      if (g) {
        isCorrect = !!g.correct;
        feedbackText = g.feedback || (isCorrect ? 'Correct!' : 'Not quite.');
      } else {
        feedbackText = 'Could not auto-grade this one — compare with the explanation below.';
      }
      if (isCorrect) { correct++; bySection[section].correct++; input.classList.add('correct'); }
      else if (g) { input.classList.add('incorrect'); }
      fb.textContent = feedbackText;
      fb.classList.add('show', isCorrect ? 'correct-fb' : 'incorrect-fb');
      recordTopic(el.dataset.topic, isCorrect);
      const exp = el.querySelector('.explain');
      if (exp) exp.classList.add('show');
    });
    return { correct, total, bySection };
  }

  async function generateBonusSet() {
    const btn = root.querySelector('#generate-btn');
    const status = root.querySelector('#generate-status');

    // AI features require a Google-authenticated session (see callAI's guard below).
    // Guest mode has no sessionToken, so fail fast with a clear reason instead of
    // letting it hit the network and fall into the generic catch-all message.
    if (!sessionToken) {
      status.textContent = 'Bonus Set butuh login Google (mode Tamu tidak bisa pakai fitur AI). Klik "Keluar" lalu masuk pakai akun Google.';
      return;
    }

    btn.disabled = true;
    status.textContent = 'Generating your bonus set — this can take a few seconds...';
    const prompt = `You are an experienced ETS-style TOEFL ITP item writer. Generate new TOEFL ITP practice questions for a study app, in two rounds:

ROUND 1 — multiple choice (8 items): 3 Structure (fill-in-the-blank grammar, 4 options each), 3 Written Expression (a sentence split into exactly 4 segments, with exactly one segment containing a grammar error), and 2 Listening (a short 3-5 line dialogue or mini-lecture transcript, each followed by exactly 1 comprehension question).

ROUND 2 — "Challenge Round", typed short-answer items (3 items), harder because there are no options to pick from — the student must produce the answer themselves:
- 1 "structure" type: give a sentence with a blank and a bracketed hint of the words/concept to use (e.g. "By the time she arrived, the meeting ___ (already / start)."), and ask the student to type the fully correct completion. acceptedAnswer should be the single best canonical completion (grading will allow minor equivalent phrasing).
- 1 "written" type: give a sentence containing one grammar error and ask the student to type out the corrected full sentence (not just the fixed word). acceptedAnswer is the fully corrected sentence.
- 1 "listening" type: include a short transcript (3-5 lines) and ask an open-ended comprehension question (e.g. "In your own words, what is the main idea?" or "What does the man imply about...?") that requires a short written response, not a single word. acceptedAnswer is a concise model answer capturing the key point(s) a correct response must include.
Each Challenge Round item needs: type, topic, prompt (the instruction/question the student sees; for "written" type embed the original sentence inside the prompt), acceptedAnswer, explanation, and — only for "listening" type — a transcript field.

Cover a mix of these grammar points across the Structure and Written Expression items (both rounds combined) — this is the exact syllabus the student's tutor teaches, so stay within it rather than drifting to unrelated grammar topics: sentence completeness / participle vs. finite main verb, appositives (noun phrases set off by commas that are not the subject), objects of a preposition vs. the true subject, present/past participle as a reduced adjective, noun clause as subject, noun clause as object, adjective clause where the connector is the subject of its own clause, reduced adjective clause (only valid when the connector was the subject), reduced adverb clause (only valid when both clauses share the same subject), inversion after a negative adverbial at the start of a sentence (e.g. Rarely, Never, Only after...), inversion after a place expression at the start of a sentence, inversion after an omitted "if" in a conditional (Should/Were/Had + subject), subject-verb agreement after quantity expressions ("Most/All/Some of the ___"), subject-verb agreement with indefinite pronouns (everybody/anyone/no one — always singular), parallel structure with coordinate conjunctions (and/but/or/so/yet) and paired conjunctions (not only...but also / either...or / neither...nor / both...and), comparative and superlative forms (-er/-est vs. more/most, never doubled), and connector logic — coordinate connectors, adverb time/cause connectors (after/before/because/since/although), and the rule against pairing "although" with a redundant "but" in the same sentence.

For the Listening items in both rounds, draw only from these categories, matching the exact TOEFL ITP short-dialogue and mini-lecture style the student has been practicing: functional expressions (agreement — "I'll say!"/"You can say that again!"; uncertainty — "I'm of two minds about it"/"Your guess is as good as mine"; suggestions — "You might want to..."; surprise — "You don't say!"), structures (passive-voice paraphrase, expressions that sound negative but mean full agreement like "I couldn't agree more", almost-negatives like "barely/hardly made it", wishes with "I wish I had...", unreal-past conditionals with "If I had known..."), and idiomatic expressions (two-part verbs like "put off", three-part verbs like "catch up on", everyday idioms like "on the fence" or "hit the books"). If writing a longer mini-lecture instead, base the question on one of: the main idea, a specific detail, the purpose of an example the speaker gives, or what the speaker/students will do next — mirroring the "four pieces of information" framework the tutor teaches.

STRICT QUALITY RULES (a real ETS writer would enforce all of these):
1. Every multiple-choice question must have EXACTLY ONE defensible correct answer under standard written English grammar rules. Before finalizing each item, mentally check the other three options and confirm each is clearly and unambiguously wrong for a specific, statable reason — not just "less natural" or a matter of style.
2. Never use options that could both be argued as correct depending on context, regional variation, or informal usage. If you can't rule out an option with total confidence, discard the question and write a different one.
3. Sentences must sound like authentic, neutral academic or workplace English (the actual register ETS uses) — not casual, not literary, not overly complex or contrived just to hide the answer.
4. Written Expression items: the three non-error segments must be completely correct as written; do not introduce a second subtle error anywhere else in the sentence.
5. Listening transcripts must be self-contained: the question must be answerable using ONLY the information in the transcript, with no outside knowledge required, and the correct answer must be traceable to a specific line.
5b. Format every listening transcript as separate lines, each starting with a speaker label followed by a colon, using ONLY these labels: "Man:", "Woman:", or "Professor:" (for a lecture/monologue). Put each speaker's turn on its own line (separated by \n). This lets the app play each line back in the correct male/female voice, so never omit or vary the labels.
6. Explanations must cite the specific rule or line of text that makes the correct answer correct, in one concise sentence.
7. Keep language at CEFR B1-B2 difficulty — appropriate for an ITP score in the 500-560 range (upper-intermediate), not beginner and not needlessly advanced/rare vocabulary.
8. Challenge Round acceptedAnswer values must be precise enough for a grader to check against, but explanations should note what variations would also be acceptable.

Return ONLY valid JSON with no markdown fences and no commentary, in exactly this shape: {"structure":[{"topic":"...","question":"...","options":["...","...","...","..."],"correctIndex":0,"explanation":"..."}],"written":[{"topic":"...","segments":["...","...","...","..."],"correctIndex":0,"explanation":"..."}],"listening":[{"transcript":"...","questions":[{"topic":"...","question":"...","options":["...","...","...","..."],"correctIndex":0,"explanation":"..."}]}],"shortAnswer":[{"type":"structure","topic":"...","prompt":"...","acceptedAnswer":"...","explanation":"..."},{"type":"written","topic":"...","prompt":"...","acceptedAnswer":"...","explanation":"..."},{"type":"listening","topic":"...","transcript":"...","prompt":"...","acceptedAnswer":"...","explanation":"..."}]}`;

    try {
      // Lowered from 8000: the free-tier Workers AI daily neuron budget is easy to
      // exhaust with a request this size, and a smaller cap also reduces the chance
      // of the model's JSON getting cut off mid-response.
      const text = await callAI({ prompt, maxTokens: 4000 });
      const clean = text.replace(/```json|```/g, '').trim();
      let parsed;
      try {
        parsed = JSON.parse(clean);
      } catch (parseErr) {
        // Most common real-world cause: the model's response got cut off before

      }
      try {
        await storageSetWithRetry('toefl-bonus-' + todayStr(), JSON.stringify(parsed), false);
      } catch (e) {
        console.error('Could not save bonus set', e);
      }
      renderBonusSet(parsed, true);
      status.textContent = 'New set ready — check the "Bonus Set" tab.';
    } catch (e) {
      console.error(e);
      // Surface the real reason when we have one, instead of always showing

      const reason = (e && e.message) ? e.message : 'Unknown error.';
      status.textContent = 'Could not generate a new set: ' + reason;
      btn.disabled = false;
    }
  }

  // ---------- Audio playback (browser text-to-speech, gender-matched) ----------
  let cachedGenderVoices = null;
  const FEMALE_VOICE_HINTS = ['zira','samantha','victoria','karen','susan','moira','tessa','fiona','aria','jenny','emma','ava','allison','nicky','kate','serena','shelley','joanna','salli','kendra','kimberly','female','woman','girl'];
  const MALE_VOICE_HINTS = ['david','alex','daniel','fred','mark','guy','ryan','george','oliver','tom','arthur','matthew','joey','justin','male','man','boy'];

  function getGenderVoices() {
    if (cachedGenderVoices) return cachedGenderVoices;
    if (!('speechSynthesis' in window)) return { male: null, female: null };
    const all = window.speechSynthesis.getVoices();
    const en = all.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
    const pool = en.length ? en : all;
    const findBy = (hints) => pool.find(v => hints.some(h => v.name.toLowerCase().includes(h)));
    let female = findBy(FEMALE_VOICE_HINTS);
    let male = findBy(MALE_VOICE_HINTS);
    const rest = pool.filter(v => v !== female && v !== male);
    if (!female) female = rest[0] || pool[0] || null;
    if (!male) male = rest.find(v => v !== female) || rest[0] || pool[0] || null;
    cachedGenderVoices = { male, female };
    return cachedGenderVoices;
  }
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = () => { cachedGenderVoices = null; getGenderVoices(); };
  }

  // Strips a leading "Man:" / "Woman:" / "Professor:" style label and surrounding quotes,
  // so only the actual spoken line is read aloud (the label itself is never spoken).
  function stripSpeakerLabel(text) {
    return text.trim().replace(/^[A-Za-z][A-Za-z .()]{0,30}:\s*/, '').replace(/^["\u201C]|["\u201D]$/g, '').trim();
  }

  function applyVoiceForSpeaker(utterance, speaker) {
    const voices = getGenderVoices();
    const s = (speaker || '').toLowerCase();
    let chosen = null;
    let pitch = 1.0;
    if (s.includes('woman') || s.includes('female') || s.endsWith('-f')) {
      chosen = voices.female; pitch = 1.08;
    } else if (s.includes('man') || s.includes('male') || s.endsWith('-m')) {
      chosen = voices.male; pitch = 0.92;
    } else {
      // Unlabeled/narrator lines: neutral default voice, neutral pitch.
      chosen = voices.female; pitch = 1.0;
    }
    utterance.pitch = pitch;
    if (chosen) {
      // Defensive: some browsers/mocks can reject a voice object that isn't a
      // genuine SpeechSynthesisVoice. Never let that break audio playback —
      // the pitch difference above already keeps male/female lines distinct.
      try { utterance.voice = chosen; } catch (e) { /* fall back to default voice + pitch only */ }
    }
  }

  function resetAudioBtn(btn) {
    btn.disabled = false;
    btn.classList.remove('playing');
    btn.textContent = '\u25B6 Play audio';
  }

  // Detects "Man:"/"Woman:"/"Professor:"-style labels inside a block of plain text
  // (used as a fallback for AI-generated passages that aren't pre-tagged with data-speaker).
  function splitByInlineLabels(text) {
    const re = /(^|\n)\s*(man|woman|professor|narrator)\s*:/gi;
    const matches = [...text.matchAll(re)];
    if (!matches.length) return null;
    const segments = [];
    for (let i = 0; i < matches.length; i++) {
      const start = matches[i].index + matches[i][0].length;
      const end = i + 1 < matches.length ? matches[i + 1].index : text.length;
      const speaker = matches[i][2].toLowerCase();
      const chunk = text.slice(start, end).trim();
      if (chunk) segments.push({ speaker, text: chunk });
    }
    return segments.length ? segments : null;
  }

  function speakPassage(target, btn) {
    if (!('speechSynthesis' in window)) {
      btn.textContent = 'Audio not supported in this browser';
      btn.disabled = true;
      return;
    }
    window.speechSynthesis.cancel();

    // Preferred path: explicit <p data-speaker="man|woman|...">line</p> markup.
    let segments = Array.from(target.querySelectorAll('[data-speaker]')).map(p => ({
      speaker: p.dataset.speaker,
      text: stripSpeakerLabel(p.textContent)
    })).filter(s => s.text);

    // Fallback: plain-text block (e.g. AI-generated bonus passages) — detect inline labels.
    if (!segments.length) {
      const raw = target.textContent.trim();
      const inline = splitByInlineLabels(raw);
      segments = inline ? inline.map(s => ({ speaker: s.speaker, text: s.text })) : [{ speaker: '', text: raw }];
    }

    if (!segments.length) { resetAudioBtn(btn); return; }

    btn.disabled = true;
    btn.classList.add('playing');
    btn.textContent = '\u25B6 Playing...';

    segments.forEach((seg, idx) => {
      const utterance = new SpeechSynthesisUtterance(seg.text);
      utterance.lang = 'en-US';
      utterance.rate = 0.95;
      applyVoiceForSpeaker(utterance, seg.speaker);
      if (idx === segments.length - 1) {
        utterance.onend = () => resetAudioBtn(btn);
        utterance.onerror = () => resetAudioBtn(btn);
      }
      window.speechSynthesis.speak(utterance);
    });
  }

  function wireAudioButton(btn) {
    btn.addEventListener('click', () => {
      const targetId = btn.dataset.target;
      const target = root.querySelector('#' + targetId);
      if (!target) return;
      speakPassage(target, btn);
    });
  }

  root.querySelectorAll('.audio-btn[data-target]').forEach(wireAudioButton);

  // ---------- Score recap + ITP estimate ----------
  window.__toeflAgg = { listeningCorrect: 0, listeningTotal: 0, swCorrect: 0, swTotal: 0 };
  window.__toeflLog = [];

  async function loadRecapData() {
    try {
      const res = await window.storage.get('toefl-agg-scores', false);
      if (res && res.value) window.__toeflAgg = JSON.parse(res.value);
    } catch (e) { /* no aggregate saved yet */ }
    try {
      const res = await window.storage.get('toefl-history-log', false);
      if (res && res.value) window.__toeflLog = JSON.parse(res.value);
    } catch (e) { /* no history saved yet */ }
    renderRecap();

  async function recordSectionScore(section, correct, total) {
    if (!total) return;
    const key = (section === 'listening') ? 'listening' : 'sw';
    window.__toeflAgg[key + 'Correct'] += correct;
    window.__toeflAgg[key + 'Total'] += total;
    window.__toeflLog.push({ date: todayStr(), section: section, correct: correct, total: total });
    if (window.__toeflLog.length > 40) window.__toeflLog = window.__toeflLog.slice(window.__toeflLog.length - 40);
    try {
      await storageSetWithRetry('toefl-agg-scores', JSON.stringify(window.__toeflAgg), false);
    } catch (e) { console.error('Could not save aggregate scores', e); }
    try {
      await storageSetWithRetry('toefl-history-log', JSON.stringify(window.__toeflLog), false);
    } catch (e) { console.error('Could not save history log', e); }
    renderRecap();
  }

  function estimateScaled(correct, total, min, max) {
    if (!total) return null;
    return Math.round(min + (correct / total) * (max - min));
  }

  function cefrForTotal(total) {
    if (total >= 543) return 'B2';
    if (total >= 433) return 'B1';
    if (total >= 343) return 'A2';
    return 'A1';
  }

  function renderRecap() {
    const wrap = root.querySelector('#recap-content');
    if (!wrap) return;
    const agg = window.__toeflAgg;
    const listeningScaled = estimateScaled(agg.listeningCorrect, agg.listeningTotal, 31, 68);
    const swScaled = estimateScaled(agg.swCorrect, agg.swTotal, 31, 68);

    let scoreBlock = '<div style="font-size:13.5px;color:var(--ink-soft);">Complete at least one Structure/Written Expression and one Listening check to see an estimate.</div>';
    if (listeningScaled !== null && swScaled !== null) {
      const partialAvg = (listeningScaled + swScaled) / 2;
      const partialTotal = Math.round(partialAvg * 10);
      const cefr = cefrForTotal(partialTotal);
      scoreBlock = `
        <div class="summary-grid">
          <div class="summary-card"><div class="k">Listening (est.)</div><div class="v">${listeningScaled}</div></div>
          <div class="summary-card"><div class="k">Structure &amp; Written Expr. (est.)</div><div class="v">${swScaled}</div></div>
          <div class="summary-card"><div class="k">Rough total (2 of 3 sections)</div><div class="v">${partialTotal}</div></div>
        </div>
        <div class="cefr-tag" style="display:inline-block;margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;border:1px solid var(--red);color:var(--red);padding:3px 10px;border-radius:12px;">~CEFR ${cefr} range</div>
        <div class="footnote">This is an unofficial, rough estimate using a simple linear conversion (ETS doesn't publish its exact raw-to-scaled "equating" tables, and they vary slightly per test). It also excludes the Reading section, which isn't part of this drill, so treat this as a directional signal, not a predicted score.</div>`;
    }

    let historyBlock = '';
    if (window.__toeflLog.length) {
      const rows = window.__toeflLog.slice().reverse().slice(0, 10).map(entry => {
        const label = entry.section === 'listening' ? 'Listening' : 'Structure &amp; Written Expr.';
        const pct = Math.round((entry.correct / entry.total) * 100);
        return `<div class="weak-item"><span>${entry.date} &middot; ${label}</span><div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div><span>${entry.correct}/${entry.total}</span></div>`;
      }).join('');
      historyBlock = `<div style="margin-top:22px;"><div class="section-label">Recent Attempts</div>${rows}</div>`;
    }

    wrap.innerHTML = scoreBlock + historyBlock;
  }

  async function loadStreak() {

  function renderStreak(streak) {
    const badge = root.querySelector('#streak-badge');

    if (streak && streak.count > 0) {
      badge.style.display = 'inline-flex';
      countEl.textContent = streak.count;
    }
  }

  async function checkAndUpdateStreak() {
    const p = window.__toeflProgress;
    if (p.correctToday < p.target) return;
    const today = todayStr();
    if (p.streakUpdatedFor === today) return;
    let streak = { lastMetDate: null, count: 0 };
    try {
      const res = await window.storage.get('toefl-streak', false);
      if (res && res.value) streak = JSON.parse(res.value);
    } catch (e) {
      // first time
    }
    if (streak.lastMetDate === today) {
      p.streakUpdatedFor = today;
      renderStreak(streak);
      return;
    }
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    const yStr = yesterday.toISOString().slice(0, 10);
    streak.count = (streak.lastMetDate === yStr) ? (streak.count || 0) + 1 : 1;
    streak.lastMetDate = today;
    try {
      await storageSetWithRetry('toefl-streak', JSON.stringify(streak), false);
    } catch (e) {
      console.error('Could not save streak', e);
    }
    p.streakUpdatedFor = today;
    renderStreak(streak);
  }

  async function sendChatMessage(question) {

    const status = root.querySelector('#chat-status');

      return t + ': ' + pct + '% (' + s.correct + '/' + s.total + ')';
    }).join(', ') || 'no data yet';

    const systemContext = 'You are a friendly, concise TOEFL ITP tutor helping a student preparing for the Structure & Written Expression and Listening sections. Their current weak-area performance in this practice app: ' + weakSummary + '. Keep answers focused and under 150 words unless the student asks for more detail. Use concrete example sentences when explaining grammar rules.';

  // ---------- Vocabulary spaced repetition ----------
  const VOCAB_DECK = [
    { word: 'ambiguous', pos: 'adjective', def: 'open to more than one interpretation; not clearly defined.', example: 'The professor\'s instructions were ambiguous, so several students misunderstood the assignment.' },
    { word: 'coincide', pos: 'verb', def: 'to happen at the same time as something else.', example: 'The construction schedule happened to coincide with final exam week.' },
    { word: 'consequently', pos: 'adverb', def: 'as a result; therefore.', example: 'The lab lost funding; consequently, the research was delayed by a year.' },
    { word: 'derive', pos: 'verb', def: 'to obtain or develop something from a source.', example: 'Many English words derive from Latin roots.' },
    { word: 'discrepancy', pos: 'noun', def: 'a difference between two things that should be the same.', example: 'There was a discrepancy between the two reports\' final numbers.' },
    { word: 'empirical', pos: 'adjective', def: 'based on observation or experiment rather than theory.', example: 'The claim lacked empirical support, so reviewers asked for more data.' },
    { word: 'feasible', pos: 'adjective', def: 'possible to do easily or practically.', example: 'Completing the survey in one week is not feasible given the current staff.' },
    { word: 'hypothesis', pos: 'noun', def: 'a proposed explanation made as a starting point for further investigation.', example: 'Her hypothesis was that warmer water slows coral growth.' },
    { word: 'inherent', pos: 'adjective', def: 'existing as a natural or basic part of something.', example: 'Risk is inherent in any long-term investment.' },
    { word: 'mitigate', pos: 'verb', def: 'to make something less severe or serious.', example: 'The new policy aims to mitigate the effects of the flooding.' },
    { word: 'notion', pos: 'noun', def: 'a belief or idea about something.', example: 'The notion that the plan would fail turned out to be wrong.' },
    { word: 'plausible', pos: 'adjective', def: 'seeming reasonable or probable.', example: 'The committee found the proposal plausible and approved further study.' },
    { word: 'prevalent', pos: 'adjective', def: 'widespread; common in a particular area or at a particular time.', example: 'The disease was especially prevalent in coastal regions.' },
    { word: 'subsequent', pos: 'adjective', def: 'coming after something in time.', example: 'The subsequent meeting addressed the concerns raised earlier.' },
    { word: 'substantial', pos: 'adjective', def: 'of considerable importance, size, or worth.', example: 'The company reported a substantial increase in revenue.' }
  ];

  let vocabProgress = {};
  let vocabQueue = [];
  let vocabIndex = 0;

  function buildVocabQueue() {
    const today = todayStr();
    vocabQueue = VOCAB_DECK.map((c, i) => i).filter(i => {
      const prog = vocabProgress[VOCAB_DECK[i].word];
      return !prog || prog.due <= today;
    });
    for (let i = vocabQueue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [vocabQueue[i], vocabQueue[j]] = [vocabQueue[j], vocabQueue[i]];
    }
    vocabIndex = 0;
  }

  function renderVocabCard() {
    const progressEl = root.querySelector('#vocab-progress');
    const card = root.querySelector('#vocab-card');
    const ratingRow = root.querySelector('#vocab-rating');
    card.classList.remove('flipped');
    ratingRow.style.display = 'none';
    if (vocabIndex >= vocabQueue.length) {
      progressEl.textContent = 'All due cards reviewed for now — nice work. Come back later or tomorrow for more.';
      root.querySelector('#vocab-word').textContent = '✓';
      root.querySelector('#vocab-pos').textContent = '';
      root.querySelector('#vocab-def').textContent = '';
      root.querySelector('#vocab-ex').textContent = '';
      root.querySelector('#vocab-tap-hint').style.display = 'none';
      return;
    }
    const c = VOCAB_DECK[vocabQueue[vocabIndex]];
    progressEl.textContent = 'Card ' + (vocabIndex + 1) + ' of ' + vocabQueue.length + ' due today';
    root.querySelector('#vocab-word').textContent = c.word;
    root.querySelector('#vocab-pos').textContent = c.pos;
    root.querySelector('#vocab-def').textContent = c.def;
    root.querySelector('#vocab-ex').textContent = c.example;
    root.querySelector('#vocab-tap-hint').style.display = '';
  }

  async function initVocab() {
    try {
      const res = await window.storage.get('toefl-vocab-progress', false);
      if (res && res.value) vocabProgress = JSON.parse(res.value);
    } catch (e) {
      // no progress yet
    }
    buildVocabQueue();
    renderVocabCard();
  }

  root.querySelector('#vocab-card').addEventListener('click', () => {
    const card = root.querySelector('#vocab-card');
    if (card.classList.contains('flipped') || vocabIndex >= vocabQueue.length) return;
    card.classList.add('flipped');
    root.querySelector('#vocab-tap-hint').style.display = 'none';
    root.querySelector('#vocab-rating').style.display = 'flex';

  root.querySelectorAll('.rating-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (vocabIndex >= vocabQueue.length) return;
      const rating = btn.dataset.rating;
      const idx = vocabQueue[vocabIndex];
      const key = VOCAB_DECK[idx].word;
      const prog = vocabProgress[key] || { interval: 0, reps: 0 };
      let interval;
      if (rating === 'again') interval = 0;
      else if (rating === 'good') interval = prog.interval ? Math.round(prog.interval * 2) : 1;
      else interval = prog.interval ? Math.round(prog.interval * 3) : 3;
      const dueDate = new Date();
      dueDate.setDate(dueDate.getDate() + interval);
      vocabProgress[key] = { interval: interval, due: dueDate.toISOString().slice(0, 10), reps: (prog.reps || 0) + 1 };
      try {
        await storageSetWithRetry('toefl-vocab-progress', JSON.stringify(vocabProgress), false);
      } catch (e) {
        console.error('Could not save vocab progress', e);
      }
      if (rating === 'again') vocabQueue.push(idx);
      vocabIndex++;
      renderVocabCard();
    });
  });

  const logoutBtn = root.querySelector('#logout-btn');
  if (logoutBtn) logoutBtn.addEventListener('click', logout);

  bootstrapAuth();

})();
</script>
</body>
</html>
