        </label>
        <span class="timer-toggle-label">Timer per section (opsional) &mdash; Listening 35:00, Structure &amp; Written Expression 25:00 gabungan, seperti ujian asli</span>
      </div>

      <div class="panel active" id="panel-structure">
        <div class="section-label">Section 2A &middot; 15 soal &middot; &plusmn;25 menit</div>
        <h2>Structure &mdash; Complete the Sentence</h2>
        <div class="hint">Pilih pilihan yang benar untuk melengkapi kalimat. Materi diambil dari kelas Structure &amp; Written Expression (Febrina R. Agustina, M.Pd.) &mdash; klausa tunggal, klausa jamak (noun/adjective clause), kalimat terbalik (inversion), dan agreement.</div>

        <div class="timer-box" data-timer-group="structure_written" style="display:none;">
          <span class="timer-label">&#9201; Sisa waktu Structure &amp; Written Expression:</span>
          <span class="timer-time">25:00</span>
          <button type="button" class="timer-reset-btn">Reset</button>
        </div>
        <div class="timer-expired-banner" data-timer-group="structure_written" style="display:none;">Waktu Structure &amp; Written Expression sudah habis. Di ujian asli kamu tidak bisa lanjut mengerjakan lagi &mdash; selesaikan sisa jawaban lalu klik Check answers.</div>

        <div class="q" data-correct="1" data-topic="Sentence completeness (predicate)" data-section="structure_written">
          <div class="qtag">Kelengkapan kalimat &mdash; predikat utama</div>
          <div class="qtext">1. The committee members meeting to discuss the merger ___ to postpone their decision until next quarter.</div>
          <div class="opt" data-i="0">deciding</div>
          <div class="opt" data-i="1">decided</div>
          <div class="opt" data-i="2">to decide</div>
          <div class="opt" data-i="3">decision</div>
          <div class="explain">"Meeting to discuss the merger" adalah frasa participle yang menerangkan subjek, bukan predikat. Kalimat butuh kata kerja utama (finite verb) yang sebenarnya: "decided."</div>
        </div>

        <div class="q" data-correct="1" data-topic="Objects of preposition + agreement" data-section="structure_written">
          <div class="qtag">Objek preposisi &amp; subject-verb agreement</div>
          <div class="qtext">2. The number of applications ___ significantly this year, according to the admissions office.</div>
          <div class="opt" data-i="0">have increased</div>
          <div class="opt" data-i="1">has increased</div>
          <div class="opt" data-i="2">are increasing</div>
          <div class="opt" data-i="3">were increase</div>
          <div class="explain">"Of applications" adalah objek preposisi, BUKAN subjek. Subjek sebenarnya adalah "The number" (tunggal), jadi kata kerjanya "has increased."</div>
        </div>

        <div class="q" data-correct="1" data-topic="Appositives" data-section="structure_written">
          <div class="qtag">Appositif (kata benda di antara koma)</div>
          <div class="qtext">3. Mr. Tanaka, the head of the engineering department, ___ the new safety protocol at Monday's meeting.</div>
          <div class="opt" data-i="0">presenting</div>
          <div class="opt" data-i="1">presented</div>
          <div class="opt" data-i="2">to present</div>
          <div class="opt" data-i="3">present</div>
          <div class="explain">"The head of the engineering department" adalah appositif (bukan subjek). Subjek sebenarnya "Mr. Tanaka" (tunggal), butuh kata kerja finite: "presented."</div>
        </div>

        <div class="q" data-correct="1" data-topic="Present participle as adjective" data-section="structure_written">
          <div class="qtag">Present participle (yang + Verb)</div>
          <div class="qtext">4. Employees ___ the training program before the deadline will receive a certificate of completion.</div>
          <div class="opt" data-i="0">complete</div>
          <div class="opt" data-i="1">completing</div>
          <div class="opt" data-i="2">completed</div>
          <div class="opt" data-i="3">will complete</div>
          <div class="explain">Bagian ini menerangkan "Employees" (yang menyelesaikan), jadi berupa present participle "completing" &mdash; bukan predikat, karena predikat kalimat sudah ada: "will receive."</div>
        </div>

        <div class="q" data-correct="2" data-topic="Past participle as adjective" data-section="structure_written">
          <div class="qtag">Past participle (yang + Verb-3)</div>
          <div class="qtext">5. The proposal ___ by the board last week requires several revisions before resubmission.</div>
          <div class="opt" data-i="0">approve</div>
          <div class="opt" data-i="1">approving</div>
          <div class="opt" data-i="2">approved</div>
          <div class="opt" data-i="3">approves</div>
          <div class="explain">Bagian ini menerangkan "proposal" (yang disetujui), jadi past participle "approved" &mdash; predikat kalimat yang sebenarnya adalah "requires."</div>
        </div>

        <div class="q" data-correct="2" data-topic="Noun clause as subject" data-section="structure_written">
          <div class="qtag">Noun clause sebagai subjek</div>
          <div class="qtext">6. ___ surprised the committee was how quickly the proposal gained approval.</div>
          <div class="opt" data-i="0">It</div>
          <div class="opt" data-i="1">That</div>
          <div class="opt" data-i="2">What</div>
          <div class="opt" data-i="3">Which</div>
          <div class="explain">Noun clause "What surprised the committee" berfungsi sebagai subjek kalimat &mdash; pola yang sama dengan "What was on television made me angry."</div>
        </div>

        <div class="q" data-correct="1" data-topic="Noun clause as object" data-section="structure_written">
          <div class="qtag">Noun clause sebagai objek</div>
          <div class="qtext">7. The manager was not aware ___ the client had already signed the contract.</div>
          <div class="opt" data-i="0">about</div>
          <div class="opt" data-i="1">that</div>
          <div class="opt" data-i="2">of</div>
          <div class="opt" data-i="3">which</div>
          <div class="explain">"Aware that + klausa" adalah pola yang benar untuk memperkenalkan noun clause sebagai objek/pelengkap.</div>
        </div>

        <div class="q" data-correct="2" data-topic="Adjective clause connector as subject" data-section="structure_written">
          <div class="qtag">Konektor Adjective Clause = subjek klausa</div>
          <div class="qtext">8. The engineer ___ designed the bridge received a national award.</div>
          <div class="opt" data-i="0">whom</div>
          <div class="opt" data-i="1">whose</div>
          <div class="opt" data-i="2">who</div>
          <div class="opt" data-i="3">which</div>
          <div class="explain">Konektor di sini menjadi subjek dari adjective clause ("___ designed the bridge"), dan karena merujuk pada orang, jawabannya "who."</div>
        </div>

        <div class="q" data-correct="1" data-topic="Reduced adjective clause" data-section="structure_written">
          <div class="qtag">Reduced Adjective Clause</div>
          <div class="qtext">9. The scientist ___ the discovery is scheduled to present her findings at the conference.</div>
          <div class="opt" data-i="0">who made</div>
          <div class="opt" data-i="1">making</div>
          <div class="opt" data-i="2">whom made</div>
          <div class="opt" data-i="3">she made</div>
          <div class="explain">Reduced Adjective Clause hanya berlaku jika konektornya menjadi subjek klausa &mdash; "who made" bisa direduksi jadi "making" (mengikuti pola "The woman who is waving" &rarr; "The woman waving").</div>
        </div>

        <div class="q" data-correct="1" data-topic="Reduced adverb clause" data-section="structure_written">
          <div class="qtag">Reduced Adverb Clause</div>
          <div class="qtext">10. ___ exhausted after the long flight, the delegates still attended the opening ceremony.</div>
          <div class="opt" data-i="0">Although they were</div>
          <div class="opt" data-i="1">Although</div>
          <div class="opt" data-i="2">They were although</div>
          <div class="opt" data-i="3">Despite they were</div>
          <div class="explain">Reduced Adverb Clause berlaku jika subjeknya sama &mdash; "Although they were exhausted" direduksi menjadi "Although exhausted" (subjek + tobe dihilangkan).</div>
        </div>

        <div class="q" data-correct="1" data-topic="Inversion after negative" data-section="structure_written">
          <div class="qtag">Inversion setelah penanda negatif</div>
          <div class="qtext">11. Rarely ___ such a well-organized conference before this year.</div>
          <div class="opt" data-i="0">the department has hosted</div>
          <div class="opt" data-i="1">has the department hosted</div>
          <div class="opt" data-i="2">the department hosted</div>
          <div class="opt" data-i="3">did the department hosted</div>
          <div class="explain">Penanda negatif "Rarely" di awal kalimat memaksa inversion (S &amp; V dibalik): "has the department hosted."</div>
        </div>

        <div class="q" data-correct="0" data-topic="Inversion after place expression" data-section="structure_written">
          <div class="qtag">Inversion setelah frasa tempat</div>
          <div class="qtext">12. In the center of the old town ___ a market that has operated for over two centuries.</div>
          <div class="opt" data-i="0">stands</div>
          <div class="opt" data-i="1">a market stands</div>
          <div class="opt" data-i="2">does a market stand</div>
          <div class="opt" data-i="3">standing</div>
          <div class="explain">Setelah frasa preposisi tempat di awal kalimat, polanya Verb + Subject: "stands a market," bukan urutan normal Subject + Verb.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Inversion after conditional" data-section="structure_written">
          <div class="qtag">Inversion pada Conditional (If dihilangkan)</div>
          <div class="qtext">13. ___ the committee approve the budget, the new wing could open by next spring.</div>
          <div class="opt" data-i="0">If</div>
          <div class="opt" data-i="1">Should</div>
          <div class="opt" data-i="2">When</div>
          <div class="opt" data-i="3">Unless</div>
          <div class="explain">"Should the committee approve..." adalah bentuk inversion untuk conditional dengan "if" yang dihilangkan (= "If the committee should approve...").</div>
        </div>

        <div class="q" data-correct="1" data-topic="Subject-verb agreement (quantity)" data-section="structure_written">
          <div class="qtag">Agreement setelah ungkapan kuantitas</div>
          <div class="qtext">14. Most of the equipment in the laboratory ___ replaced after the fire last year.</div>
          <div class="opt" data-i="0">were</div>
          <div class="opt" data-i="1">was</div>
          <div class="opt" data-i="2">are</div>
          <div class="opt" data-i="3">have been</div>
          <div class="explain">"Equipment" tidak bisa dihitung (uncountable) sehingga dianggap tunggal. Pada "Most of the ___," kata kerja mengikuti kata benda setelah "of": "was."</div>
        </div>

        <div class="q" data-correct="1" data-topic="Parallel structure (paired conjunctions)" data-section="structure_written">
          <div class="qtag">Parallel Structure &mdash; paired conjunctions</div>
          <div class="qtext">15. The scholarship covers not only tuition and housing but also ___ for textbooks and course materials.</div>
          <div class="opt" data-i="0">provides funding</div>
          <div class="opt" data-i="1">funding</div>
          <div class="opt" data-i="2">to fund</div>
          <div class="opt" data-i="3">it funds</div>
          <div class="explain">"Not only X but also Y" harus paralel. X = "tuition and housing" (kata benda), maka Y juga harus kata benda: "funding."</div>
        </div>

        <button class="btn" id="structure-check">Check answers</button>
      </div>

      <div class="panel" id="panel-written">
        <div class="section-label">Section 2B &middot; 25 soal &middot; termasuk dalam &plusmn;25 menit Section 2</div>
        <h2>Written Expression &mdash; Find the Error</h2>
        <div class="hint">Klik satu segmen yang salah secara tata bahasa. Tiga segmen lain sudah pasti benar. Mengikuti materi Structure &amp; Written Expression Pt.2 (Subject-Verb Agreement, Parallel Structure, Comparatives, Connectors).</div>

        <div class="timer-box" data-timer-group="structure_written" style="display:none;">
          <span class="timer-label">&#9201; Sisa waktu Structure &amp; Written Expression:</span>
          <span class="timer-time">25:00</span>
          <button type="button" class="timer-reset-btn">Reset</button>
        </div>
        <div class="timer-expired-banner" data-timer-group="structure_written" style="display:none;">Waktu Structure &amp; Written Expression sudah habis. Di ujian asli kamu tidak bisa lanjut mengerjakan lagi &mdash; selesaikan sisa jawaban lalu klik Check answers.</div>

        <div class="q" data-topic="Subject-verb agreement" data-section="structure_written">
          <div class="qtag">Subject-verb agreement</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">The results of the survey</span>
            <span class="seg" data-i="1">indicates</span>
            <span class="seg" data-i="2">that most employees prefer</span>
            <span class="seg" data-i="3">flexible working hours.</span>
          </div>
          <div class="explain">"Results" (plural) adalah subjek sebenarnya, jadi kata kerjanya harus "indicate," bukan "indicates."</div>
        </div>

        <div class="q" data-topic="Appositive + agreement" data-section="structure_written">
          <div class="qtag">Appositif &amp; subject-verb agreement</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">The director, along with several senior staff members,</span>
            <span class="seg" data-i="1">are reviewing</span>
            <span class="seg" data-i="2">the annual budget</span>
            <span class="seg" data-i="3">before the shareholders meeting next week.</span>
          </div>
          <div class="explain">"Along with..." adalah frasa parentetis, bukan bagian dari subjek. Subjek asli "director" (tunggal), jadi seharusnya "is reviewing."</div>
        </div>

        <div class="q" data-topic="Sentence completeness (participle as verb)" data-section="structure_written">
          <div class="qtag">Kelengkapan kalimat &mdash; participle bukan predikat</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">The workers</span>
            <span class="seg" data-i="1">repairing the damaged pipeline</span>
            <span class="seg" data-i="2">throughout the weekend</span>
            <span class="seg" data-i="3">to prevent further leakage into the river.</span>
          </div>
          <div class="explain">"Repairing" adalah participle, bukan kata kerja finite &mdash; kalimat ini tidak punya predikat utama. Seharusnya "repaired" (simple past).</div>
        </div>

        <div class="q" data-topic="Past participle as verb" data-section="structure_written">
          <div class="qtag">Past participle butuh tobe</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">The building</span>
            <span class="seg" data-i="1">damaged severely</span>
            <span class="seg" data-i="2">during the storm,</span>
            <span class="seg" data-i="3">but the repair crew arrived within hours.</span>
          </div>
          <div class="explain">"Damaged" adalah past participle yang butuh auxiliary "be" agar bisa jadi predikat &mdash; seharusnya "was damaged severely."</div>
        </div>

        <div class="q" data-topic="Parallel structure" data-section="structure_written">
          <div class="qtag">Parallel structure</div>
          <div class="we-sentence" data-correct="2">
            <span class="seg" data-i="0">The manual explains how to install the software,</span>
            <span class="seg" data-i="1">configure the settings,</span>
            <span class="seg" data-i="2">and troubleshooting</span>
            <span class="seg" data-i="3">common errors.</span>
          </div>
          <div class="explain">Daftar ini harus paralel dengan "install... configure... troubleshoot," jadi "troubleshooting" seharusnya "troubleshoot."</div>
        </div>

        <div class="q" data-topic="Word form" data-section="structure_written">
          <div class="qtag">Word form</div>
          <div class="we-sentence" data-correct="3">
            <span class="seg" data-i="0">Despite the heavy rain,</span>
            <span class="seg" data-i="1">the construction crew</span>
            <span class="seg" data-i="2">finished the project</span>
            <span class="seg" data-i="3">on a timely fashion.</span>
          </div>
          <div class="explain">Ungkapan tetap adalah "in a timely fashion," bukan "on a timely fashion" &mdash; kesalahan pilihan preposisi.</div>
        </div>

        <div class="q" data-topic="Articles" data-section="structure_written">
          <div class="qtag">Articles</div>
          <div class="we-sentence" data-correct="0">
            <span class="seg" data-i="0">A equipment</span>
            <span class="seg" data-i="1">used in the laboratory</span>
            <span class="seg" data-i="2">must be inspected</span>
            <span class="seg" data-i="3">every six months.</span>
          </div>
          <div class="explain">"Equipment" tidak bisa dihitung (uncountable), jadi tidak bisa memakai "a/an"; seharusnya cukup "Equipment" atau "The equipment."</div>
        </div>

        <div class="q" data-topic="Comparatives" data-section="structure_written">
          <div class="qtag">Comparative structures</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">Reviewers agreed that</span>
            <span class="seg" data-i="1">this laptop is more faster</span>
            <span class="seg" data-i="2">than the previous model,</span>
            <span class="seg" data-i="3">especially when running heavy software.</span>
          </div>
          <div class="explain">"More faster" adalah double comparative &mdash; "faster" sudah berbentuk comparative, jadi "more" harus dihilangkan.</div>
        </div>

        <div class="q" data-topic="Relative clauses" data-section="structure_written">
          <div class="qtag">Relative clauses</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">The report,</span>
            <span class="seg" data-i="1">who was published last month,</span>
            <span class="seg" data-i="2">received significant attention</span>
            <span class="seg" data-i="3">from policymakers.</span>
          </div>
          <div class="explain">"Who" merujuk pada orang, sedangkan "report" adalah benda &mdash; seharusnya "which was published."</div>
        </div>

        <div class="q" data-topic="Adjective clause connector" data-section="structure_written">
          <div class="qtag">Konektor Adjective Clause &mdash; orang vs benda</div>
          <div class="we-sentence" data-correct="2">
            <span class="seg" data-i="0">The company launched</span>
            <span class="seg" data-i="1">a new policy</span>
            <span class="seg" data-i="2">who requires all employees</span>
            <span class="seg" data-i="3">to complete safety training annually.</span>
          </div>
          <div class="explain">"Who" merujuk pada orang, sedangkan "policy" adalah benda &mdash; klausa seharusnya diawali "which requires."</div>
        </div>

        <div class="q" data-topic="Reduced adjective clause" data-section="structure_written">
          <div class="qtag">Reduced Adjective Clause &mdash; salah subjek</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">Written entirely by volunteers,</span>
            <span class="seg" data-i="1">the city</span>
            <span class="seg" data-i="2">has published a guidebook</span>
            <span class="seg" data-i="3">that highlights local history and culture.</span>
          </div>
          <div class="explain">Klausa reduksi "written entirely by volunteers" harus menerangkan kata benda tepat setelah koma &mdash; seharusnya "the guidebook," bukan "the city" (yang bukan ditulis oleh volunteer).</div>
        </div>

        <div class="q" data-topic="Reduced adverb clause" data-section="structure_written">
          <div class="qtag">Reduced Adverb Clause &mdash; subjek tidak sama</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">While preparing for the exam,</span>
            <span class="seg" data-i="1">the library</span>
            <span class="seg" data-i="2">stayed open until midnight</span>
            <span class="seg" data-i="3">to accommodate the students.</span>
          </div>
          <div class="explain">Reduced Adverb Clause hanya berlaku jika subjeknya sama dengan klausa utama. Di sini yang "preparing" adalah mahasiswa, bukan "the library" &mdash; subjeknya tidak cocok.</div>
        </div>

        <div class="q" data-topic="Gerund/infinitive" data-section="structure_written">
          <div class="qtag">Gerund vs. infinitive</div>
          <div class="we-sentence" data-correct="2">
            <span class="seg" data-i="0">The manager suggested</span>
            <span class="seg" data-i="1">that the team</span>
            <span class="seg" data-i="2">to revise</span>
            <span class="seg" data-i="3">the timeline before submitting it.</span>
          </div>
          <div class="explain">Pola "suggest that + subject + base verb" adalah yang benar &mdash; "to revise" seharusnya "revise."</div>
        </div>

        <div class="q" data-topic="Tense consistency" data-section="structure_written">
          <div class="qtag">Tense consistency</div>
          <div class="we-sentence" data-correct="3">
            <span class="seg" data-i="0">Researchers had already collected</span>
            <span class="seg" data-i="1">the data</span>
            <span class="seg" data-i="2">before the funding</span>
            <span class="seg" data-i="3">runs out.</span>
          </div>
          <div class="explain">Peristiwa lampau yang lebih dulu ("had already collected") butuh simple past yang sesuai di klausa waktu: "ran out," bukan "runs out."</div>
        </div>

        <div class="q" data-topic="Quantifiers" data-section="structure_written">
          <div class="qtag">Quantifiers</div>
          <div class="we-sentence" data-correct="0">
            <span class="seg" data-i="0">A little students</span>
            <span class="seg" data-i="1">attended the seminar</span>
            <span class="seg" data-i="2">because it conflicted</span>
            <span class="seg" data-i="3">with final exams.</span>
          </div>
          <div class="explain">"Students" bisa dihitung (countable), jadi seharusnya berpasangan dengan "a few," bukan "a little" yang khusus untuk uncountable.</div>
        </div>

        <div class="q" data-topic="Passive voice" data-section="structure_written">
          <div class="qtag">Passive voice</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">The proposal</span>
            <span class="seg" data-i="1">is currently reviewing</span>
            <span class="seg" data-i="2">by the finance committee</span>
            <span class="seg" data-i="3">before it goes to the board.</span>
          </div>
          <div class="explain">"The proposal" menerima aksi, bukan melakukan, jadi butuh passive: "is currently being reviewed," bukan "is currently reviewing."</div>
        </div>

        <div class="q" data-topic="Noun clause word order" data-section="structure_written">
          <div class="qtag">Noun clause &mdash; urutan kata</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">Nobody could explain</span>
            <span class="seg" data-i="1">how did the error occur</span>
            <span class="seg" data-i="2">in the final report</span>
            <span class="seg" data-i="3">before it was sent to the client.</span>
          </div>
          <div class="explain">Di dalam noun clause, urutan kata tetap normal (subjek sebelum kata kerja) &mdash; seharusnya "how the error occurred," bukan bentuk tanya terbalik "how did the error occur."</div>
        </div>

        <div class="q" data-topic="Inversion after negative" data-section="structure_written">
          <div class="qtag">Inversion setelah penanda negatif</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">Never</span>
            <span class="seg" data-i="1">the department has faced</span>
            <span class="seg" data-i="2">such a significant budget cut</span>
            <span class="seg" data-i="3">in its entire history.</span>
          </div>
          <div class="explain">Penanda negatif "Never" di awal kalimat memaksa inversion &mdash; seharusnya "has the department faced," bukan urutan normal "the department has faced."</div>
        </div>

        <div class="q" data-topic="Inversion after Only" data-section="structure_written">
          <div class="qtag">Inversion setelah "Only..."</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">Only after the inspection was completed</span>
            <span class="seg" data-i="1">the factory was allowed</span>
            <span class="seg" data-i="2">to resume</span>
            <span class="seg" data-i="3">its normal daily operations.</span>
          </div>
          <div class="explain">Pembuka "Only after..." memaksa inversion pada klausa utama &mdash; seharusnya "was the factory allowed," bukan "the factory was allowed."</div>
        </div>

        <div class="q" data-topic="Inversion after place expression" data-section="structure_written">
          <div class="qtag">Inversion setelah frasa tempat</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">Beside the old library</span>
            <span class="seg" data-i="1">stood was</span>
            <span class="seg" data-i="2">a small fountain</span>
            <span class="seg" data-i="3">that had been there for decades.</span>
          </div>
          <div class="explain">Setelah frasa tempat, polanya cukup Verb + Subject &mdash; seharusnya "stood a small fountain," bukan "stood was" yang menumpuk dua kata kerja.</div>
        </div>

        <div class="q" data-topic="Conditionals" data-section="structure_written">
          <div class="qtag">Conditional Type 3</div>
          <div class="we-sentence" data-correct="2">
            <span class="seg" data-i="0">If the team had communicated</span>
            <span class="seg" data-i="1">more clearly,</span>
            <span class="seg" data-i="2">the project would finished</span>
            <span class="seg" data-i="3">on schedule.</span>
          </div>
          <div class="explain">Klausa hasil pada Conditional Type 3 butuh "would have + past participle" &mdash; seharusnya "would have finished," bukan "would finished."</div>
        </div>

        <div class="q" data-topic="Connectors (coordinate)" data-section="structure_written">
          <div class="qtag">Coordinate Connector &mdash; logika salah</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">The results were statistically significant,</span>
            <span class="seg" data-i="1">so</span>
            <span class="seg" data-i="2">the sample size was too small</span>
            <span class="seg" data-i="3">to draw firm conclusions.</span>
          </div>
          <div class="explain">Kedua klausa saling bertentangan (hasil signifikan vs. sampel terlalu kecil), jadi konektornya seharusnya "but," bukan "so" yang menandakan sebab-akibat.</div>
        </div>

        <div class="q" data-topic="Connectors (cause vs contrast)" data-section="structure_written">
          <div class="qtag">Adverb Connector &mdash; cause vs contrast</div>
          <div class="we-sentence" data-correct="0">
            <span class="seg" data-i="0">Because the new policy reduced processing time,</span>
            <span class="seg" data-i="1">employee complaints</span>
            <span class="seg" data-i="2">have increased significantly</span>
            <span class="seg" data-i="3">since it started.</span>
          </div>
          <div class="explain">Kedua klausa menunjukkan pertentangan yang tak terduga (efisiensi naik, tapi komplain juga naik), jadi konektornya seharusnya "Although," bukan "Because" yang bersifat sebab-akibat.</div>
        </div>

        <div class="q" data-topic="Connectors (redundant although/but)" data-section="structure_written">
          <div class="qtag">Contrast Connector &mdash; konektor ganda</div>
          <div class="we-sentence" data-correct="2">
            <span class="seg" data-i="0">Although the flight was delayed</span>
            <span class="seg" data-i="1">for several hours,</span>
            <span class="seg" data-i="2">but the passengers remained</span>
            <span class="seg" data-i="3">remarkably calm throughout.</span>
          </div>
          <div class="explain">"Although" sudah menandakan kontras, jadi memasangkannya dengan "but" jadi berlebihan &mdash; klausa kedua cukup dimulai "the passengers remained," tanpa "but."</div>
        </div>

        <div class="q" data-topic="Word form (adverb)" data-section="structure_written">
          <div class="qtag">Word form &mdash; adjective vs adverb</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">The technician completed</span>
            <span class="seg" data-i="1">the repair quick and careful,</span>
            <span class="seg" data-i="2">impressing the entire</span>
            <span class="seg" data-i="3">maintenance team.</span>
          </div>
          <div class="explain">Kata yang menerangkan bagaimana sebuah aksi dilakukan harus berupa adverb &mdash; seharusnya "quickly and carefully," bukan bentuk adjective "quick and careful."</div>
        </div>

        <button class="btn" id="written-check">Check answers</button>
      </div>

      <div class="panel" id="panel-listening">
        <div class="section-label">Section 1 &middot; 50 soal &middot; &plusmn;35 menit &middot; text-based simulation</div>
        <h2>Listening</h2>
        <div class="hint">Klik "Play audio" sekali, dengarkan sambil mencatat, baru jawab &mdash; pada ujian asli audio hanya diputar sekali. Suara otomatis menyesuaikan pembicara: <b>pria = suara laki-laki</b>, <b>wanita = suara perempuan</b> (mengikuti browser yang mendukung Text-to-Speech).</div>

        <div class="timer-box" data-timer-group="listening" style="display:none;">
          <span class="timer-label">&#9201; Sisa waktu Listening:</span>
          <span class="timer-time">35:00</span>
          <button type="button" class="timer-reset-btn">Reset</button>
        </div>
        <div class="timer-expired-banner" data-timer-group="listening" style="display:none;">Waktu Listening sudah habis. Di ujian asli kamu tidak bisa lanjut mengerjakan lagi &mdash; selesaikan sisa jawaban lalu klik Check answers.</div>

        <div class="section-label" style="margin-top:4px;">Part A &middot; Short Dialogues (30 soal)</div>

        <div class="q" data-correct="1" data-topic="Listening - functional expression (agreement)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Agreement</div>
          <button class="audio-btn" data-target="sd-passage-1">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-1">
            <p data-speaker="woman"><b>Woman:</b> "This traffic today is absolutely unbearable."</p>
            <p data-speaker="man"><b>Man:</b> "I'll say! It took me almost an hour just to get downtown."</p>
          </div>
          <div class="qtext">1. What does the man mean?</div>
          <div class="opt" data-i="0">He disagrees with the woman.</div>
          <div class="opt" data-i="1">He strongly agrees with her.</div>
          <div class="opt" data-i="2">He is asking her to repeat what she said.</div>
          <div class="opt" data-i="3">He didn't hear what she said.</div>
          <div class="explain">"I'll say!" adalah ungkapan setuju yang kuat &mdash; bukan permintaan mengulang.</div>
        </div>

        <div class="q" data-correct="2" data-topic="Listening - functional expression (agreement)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Agreement</div>
          <button class="audio-btn" data-target="sd-passage-2">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-2">
            <p data-speaker="man"><b>Man:</b> "This is definitely the hardest exam we've had all semester."</p>
            <p data-speaker="woman"><b>Woman:</b> "You can say that again!"</p>
          </div>
          <div class="qtext">2. What does the woman mean?</div>
          <div class="opt" data-i="0">She wants him to repeat his sentence.</div>
          <div class="opt" data-i="1">She thinks he's wrong.</div>
          <div class="opt" data-i="2">She completely agrees with him.</div>
          <div class="opt" data-i="3">She didn't understand him.</div>
          <div class="explain">"You can say that again!" adalah ungkapan setuju kuat, BUKAN permintaan untuk mengulang kalimat.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - functional expression (uncertainty)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Uncertainty</div>
          <button class="audio-btn" data-target="sd-passage-3">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-3">
            <p data-speaker="woman"><b>Woman:</b> "Have you decided whether to accept the job offer in Chicago?"</p>
            <p data-speaker="man"><b>Man:</b> "Honestly, I'm of two minds about it."</p>
          </div>
          <div class="qtext">3. What does the man mean?</div>
          <div class="opt" data-i="0">He has already made his decision.</div>
          <div class="opt" data-i="1">He is still undecided.</div>
          <div class="opt" data-i="2">He has two job offers.</div>
          <div class="opt" data-i="3">He rejected the offer.</div>
          <div class="explain">"Of two minds" berarti belum bisa memutuskan / masih ragu.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - functional expression (uncertainty)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Uncertainty</div>
          <button class="audio-btn" data-target="sd-passage-4">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-4">
            <p data-speaker="man"><b>Man:</b> "Why hasn't the professor posted our grades yet?"</p>
            <p data-speaker="woman"><b>Woman:</b> "Your guess is as good as mine."</p>
          </div>
          <div class="qtext">4. What does the woman imply?</div>
          <div class="opt" data-i="0">She knows exactly why.</div>
          <div class="opt" data-i="1">She has no idea either.</div>
          <div class="opt" data-i="2">She thinks the professor forgot.</div>
          <div class="opt" data-i="3">She already asked the professor.</div>
          <div class="explain">"Your guess is as good as mine" = dia juga tidak tahu, sama seperti si penanya.</div>
        </div>

        <div class="q" data-correct="2" data-topic="Listening - functional expression (suggestion)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Suggestion</div>
          <button class="audio-btn" data-target="sd-passage-5">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-5">
            <p data-speaker="woman"><b>Woman:</b> "I've been getting terrible headaches from staring at my screen all day."</p>
            <p data-speaker="man"><b>Man:</b> "You might want to take more breaks and adjust the brightness."</p>
          </div>
          <div class="qtext">5. What does the man suggest?</div>
          <div class="opt" data-i="0">That she see a doctor immediately.</div>
          <div class="opt" data-i="1">That she stop using her computer.</div>
          <div class="opt" data-i="2">That she take breaks and lower the screen brightness.</div>
          <div class="opt" data-i="3">That she buy a new screen.</div>
          <div class="explain">"You might want to..." adalah saran halus &mdash; di sini menyarankan istirahat dan menurunkan kecerahan layar.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - functional expression (surprise)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Surprise</div>
          <button class="audio-btn" data-target="sd-passage-6">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-6">
            <p data-speaker="man"><b>Man:</b> "Did you hear? The bookstore on campus is closing permanently."</p>
            <p data-speaker="woman"><b>Woman:</b> "You don't say! I had no idea."</p>
          </div>
          <div class="qtext">6. What does the woman's response show?</div>
          <div class="opt" data-i="0">She already knew about it.</div>
          <div class="opt" data-i="1">She is expressing surprise.</div>
          <div class="opt" data-i="2">She doesn't believe him.</div>
          <div class="opt" data-i="3">She is annoyed.</div>
          <div class="explain">"You don't say!" mengekspresikan keterkejutan ringan mendengar informasi baru.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - structures (passive paraphrase)" data-section="listening">
          <div class="qtag">Structures &mdash; Passive Voice Paraphrase</div>
          <button class="audio-btn" data-target="sd-passage-7">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-7">
            <p data-speaker="woman"><b>Woman:</b> "The committee revised the schedule after several complaints."</p>
            <p data-speaker="man"><b>Man:</b> "Oh, so that's why everything changed."</p>
          </div>
          <div class="qtext">7. What happened to the schedule?</div>
          <div class="opt" data-i="0">It was ignored.</div>
          <div class="opt" data-i="1">It was updated.</div>
          <div class="opt" data-i="2">It was cancelled entirely.</div>
          <div class="opt" data-i="3">It stayed the same.</div>
          <div class="explain">"The committee revised the schedule" diparafrasekan menjadi "The schedule was updated" (passive).</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - structures (negative expressions)" data-section="listening">
          <div class="qtag">Structures &mdash; Negative Expressions</div>
          <button class="audio-btn" data-target="sd-passage-8">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-8">
            <p data-speaker="man"><b>Man:</b> "I really think we should invest more in renewable energy research."</p>
            <p data-speaker="woman"><b>Woman:</b> "I couldn't agree more."</p>
          </div>
          <div class="qtext">8. What does the woman mean?</div>
          <div class="opt" data-i="0">She disagrees somewhat.</div>
          <div class="opt" data-i="1">She completely agrees.</div>
          <div class="opt" data-i="2">She is undecided.</div>
          <div class="opt" data-i="3">She agrees more than before, but not fully.</div>
          <div class="explain">"I couldn't agree more" TIDAK bersifat negatif &mdash; artinya setuju sepenuhnya.</div>
        </div>

        <div class="q" data-correct="2" data-topic="Listening - structures (almost negatives)" data-section="listening">
          <div class="qtag">Structures &mdash; Almost Negatives</div>
          <button class="audio-btn" data-target="sd-passage-9">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-9">
            <p data-speaker="woman"><b>Woman:</b> "Did James make it to the meeting on time?"</p>
            <p data-speaker="man"><b>Man:</b> "He barely made it &mdash; he walked in just as it started."</p>
          </div>
          <div class="qtext">9. What does "barely made it" mean?</div>
          <div class="opt" data-i="0">He missed the meeting completely.</div>
          <div class="opt" data-i="1">He arrived very early.</div>
          <div class="opt" data-i="2">He almost didn't make it in time.</div>
          <div class="opt" data-i="3">He was asked to leave.</div>
          <div class="explain">"Barely/hardly made it" = hampir terlambat, tapi tetap datang tepat waktu.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - structures (wishes)" data-section="listening">
          <div class="qtag">Structures &mdash; Wishes</div>
          <button class="audio-btn" data-target="sd-passage-10">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-10">
            <p data-speaker="man"><b>Man:</b> "It's really pouring outside right now."</p>
            <p data-speaker="woman"><b>Woman:</b> "I wish I had brought an umbrella."</p>
          </div>
          <div class="qtext">10. What does the woman imply?</div>
          <div class="opt" data-i="0">She did bring an umbrella.</div>
          <div class="opt" data-i="1">She didn't bring one and now regrets it.</div>
          <div class="opt" data-i="2">She likes walking in the rain.</div>
          <div class="opt" data-i="3">She is asking the man for an umbrella.</div>
          <div class="explain">"I wish I had brought..." menyiratkan dia TIDAK membawa payung dan menyesalinya.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - structures (conditionals)" data-section="listening">
          <div class="qtag">Structures &mdash; Conditionals (Unreal Past)</div>
          <button class="audio-btn" data-target="sd-passage-11">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-11">
            <p data-speaker="woman"><b>Woman:</b> "Why did you go to the party if you had so much homework?"</p>
            <p data-speaker="man"><b>Man:</b> "If I had known about the exam, I wouldn't have gone."</p>
          </div>
          <div class="qtext">11. What does the man imply?</div>
          <div class="opt" data-i="0">He knew about the exam and went anyway.</div>
          <div class="opt" data-i="1">He didn't know about the exam, so he went.</div>
          <div class="opt" data-i="2">He has no homework.</div>
          <div class="opt" data-i="3">He is going to another party.</div>
          <div class="explain">Conditional tipe 3 menyiratkan kebalikan dari yang diucapkan: dia TIDAK tahu soal ujian, makanya dia pergi.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - idiomatic (two-part verb)" data-section="listening">
          <div class="qtag">Idiomatic Expression &mdash; Two-Part Verb</div>
          <button class="audio-btn" data-target="sd-passage-12">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-12">
            <p data-speaker="man"><b>Man:</b> "Have you started working on your research paper yet?"</p>
            <p data-speaker="woman"><b>Woman:</b> "Not yet, I keep putting it off."</p>
          </div>
          <div class="qtext">12. What does the woman mean?</div>
          <div class="opt" data-i="0">She has already finished it.</div>
          <div class="opt" data-i="1">She keeps postponing it.</div>
          <div class="opt" data-i="2">She cancelled the assignment.</div>
          <div class="opt" data-i="3">She rejected the topic.</div>
          <div class="explain">"Put off" berarti menunda.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - idiomatic (three-part verb)" data-section="listening">
          <div class="qtag">Idiomatic Expression &mdash; Three-Part Verb</div>
          <button class="audio-btn" data-target="sd-passage-13">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-13">
            <p data-speaker="woman"><b>Woman:</b> "You look exhausted today."</p>
            <p data-speaker="man"><b>Man:</b> "Yeah, I stayed up all night trying to catch up on my reading."</p>
          </div>
          <div class="qtext">13. What was the man doing?</div>
          <div class="opt" data-i="0">Reducing how much he reads.</div>
          <div class="opt" data-i="1">Getting up to date on reading he had fallen behind on.</div>
          <div class="opt" data-i="2">Quitting his reading class.</div>
          <div class="opt" data-i="3">Reading for the first time.</div>
          <div class="explain">"Catch up on" berarti mengejar ketertinggalan / menyusul sesuatu yang tertunda.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - idiomatic (everyday idiom)" data-section="listening">
          <div class="qtag">Idiomatic Expression &mdash; Everyday Idiom</div>
          <button class="audio-btn" data-target="sd-passage-14">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-14">
            <p data-speaker="man"><b>Man:</b> "Are you going to take the marketing internship or the finance one?"</p>
            <p data-speaker="woman"><b>Woman:</b> "Honestly, I'm still on the fence about it."</p>
          </div>
          <div class="qtext">14. What does the woman mean?</div>
          <div class="opt" data-i="0">She has already chosen.</div>
          <div class="opt" data-i="1">She is undecided.</div>
          <div class="opt" data-i="2">She rejected both offers.</div>
          <div class="opt" data-i="3">She is not eligible for either.</div>
          <div class="explain">"On the fence" berarti belum memutuskan / masih ragu.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - idiomatic (everyday idiom)" data-section="listening">
          <div class="qtag">Idiomatic Expression &mdash; Everyday Idiom</div>
          <button class="audio-btn" data-target="sd-passage-15">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-15">
            <p data-speaker="woman"><b>Woman:</b> "Are you free to grab dinner tonight?"</p>
            <p data-speaker="man"><b>Man:</b> "I wish, but I really need to hit the books before tomorrow's test."</p>
          </div>
          <div class="qtext">15. What does the man mean he needs to do?</div>
          <div class="opt" data-i="0">Buy some new books.</div>
          <div class="opt" data-i="1">Study hard.</div>
          <div class="opt" data-i="2">Return library books.</div>
          <div class="opt" data-i="3">Take a break from studying.</div>
          <div class="explain">"Hit the books" berarti belajar dengan giat.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - focus on last line" data-section="listening">
          <div class="qtag">Strategy &mdash; Focus on the Last Line</div>
          <button class="audio-btn" data-target="sd-passage-16">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-16">
            <p data-speaker="woman"><b>Woman:</b> "I heard the staff meeting got moved to 3 PM."</p>
            <p data-speaker="man"><b>Man:</b> "Actually, it's back to 2 PM again."</p>
          </div>
          <div class="qtext">16. What does the man imply about the meeting time?</div>
          <div class="opt" data-i="0">It is now at 3 PM.</div>
          <div class="opt" data-i="1">It is back to the original 2 PM time.</div>
          <div class="opt" data-i="2">It has been cancelled.</div>
          <div class="opt" data-i="3">He is not sure of the time.</div>
          <div class="explain">Jawaban yang benar selalu ada di baris TERAKHIR dialog &mdash; koreksi terbaru datang dari si pria, bukan dari pernyataan awal si wanita.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - synonym recognition" data-section="listening">
          <div class="qtag">Strategy &mdash; Synonym Recognition</div>
          <button class="audio-btn" data-target="sd-passage-17">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-17">
            <p data-speaker="woman"><b>Woman:</b> "This laptop is quite pricey."</p>
            <p data-speaker="man"><b>Man:</b> "Yeah, but it's worth every penny."</p>
          </div>
          <div class="qtext">17. What does the man mean?</div>
          <div class="opt" data-i="0">The laptop is actually cheap.</div>
          <div class="opt" data-i="1">The laptop is expensive but worthwhile.</div>
          <div class="opt" data-i="2">He wants a refund.</div>
          <div class="opt" data-i="3">He regrets buying it.</div>
          <div class="explain">Jawaban yang benar sering memakai sinonim ("expensive" untuk "pricey"), bukan kata yang sama persis dari dialog.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - avoid similar sounds" data-section="listening">
          <div class="qtag">Strategy &mdash; Avoid Similar Sounds</div>
          <button class="audio-btn" data-target="sd-passage-18">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-18">
            <p data-speaker="woman"><b>Woman:</b> "Did you check the mail today?"</p>
            <p data-speaker="man"><b>Man:</b> "Yes, there's a bill from the electric company."</p>
          </div>
          <div class="qtext">18. What did the man find in the mail?</div>
          <div class="opt" data-i="0">A bell from the electric company</div>
          <div class="opt" data-i="1">A bill from the electric company</div>
          <div class="opt" data-i="2">A ball from the electric company</div>
          <div class="opt" data-i="3">A bull from the electric company</div>
          <div class="explain">Hindari jebakan kata yang bunyinya mirip ("bell/ball/bull" vs "bill") &mdash; dengarkan makna, bukan sekadar bunyi.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - structures (multiple nouns)" data-section="listening">
          <div class="qtag">Structures &mdash; Who/What with Multiple Nouns</div>
          <button class="audio-btn" data-target="sd-passage-19">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-19">
            <p data-speaker="woman"><b>Woman:</b> "The professor gave the students the results before the exam."</p>
            <p data-speaker="man"><b>Man:</b> "Oh good, so they knew ahead of time."</p>
          </div>
          <div class="qtext">19. Who received the results?</div>
          <div class="opt" data-i="0">The professor</div>
          <div class="opt" data-i="1">The students</div>
          <div class="opt" data-i="2">The exam</div>
          <div class="opt" data-i="3">No one</div>
          <div class="explain">Kalimat punya dua kata benda (professor, students) &mdash; perhatikan siapa pelaku dan siapa penerima aksi "memberi".</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - structures (double negatives)" data-section="listening">
          <div class="qtag">Structures &mdash; Double Negatives</div>
          <button class="audio-btn" data-target="sd-passage-20">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-20">
            <p data-speaker="woman"><b>Woman:</b> "Is it common for flights to be delayed here?"</p>
            <p data-speaker="man"><b>Man:</b> "It's not uncommon, especially in winter."</p>
          </div>
          <div class="qtext">20. What does the man mean?</div>
          <div class="opt" data-i="0">Flight delays are rare.</div>
          <div class="opt" data-i="1">Flight delays are fairly common.</div>
          <div class="opt" data-i="2">Flights are never delayed.</div>
          <div class="opt" data-i="3">He doesn't know.</div>
          <div class="explain">"Not uncommon" adalah double negative &mdash; dua negatif jadi positif, artinya "cukup umum/sering terjadi."</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - structures (negative comparatives)" data-section="listening">
          <div class="qtag">Structures &mdash; Negatives with Comparatives</div>
          <button class="audio-btn" data-target="sd-passage-21">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-21">
            <p data-speaker="woman"><b>Woman:</b> "How was the new restaurant compared to the old one?"</p>
            <p data-speaker="man"><b>Man:</b> "It wasn't any better."</p>
          </div>
          <div class="qtext">21. What does the man mean?</div>
          <div class="opt" data-i="0">The new restaurant was better.</div>
          <div class="opt" data-i="1">The new restaurant was the same or worse.</div>
          <div class="opt" data-i="2">The new restaurant was much better.</div>
          <div class="opt" data-i="3">He didn't try the new restaurant.</div>
          <div class="explain">"Wasn't any better" = negatif + comparative &mdash; artinya TIDAK lebih baik (sama saja atau malah lebih buruk).</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - functional expression (agreement)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Agreement</div>
          <button class="audio-btn" data-target="sd-passage-22">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-22">
            <p data-speaker="woman"><b>Woman:</b> "This heat is unbearable."</p>
            <p data-speaker="man"><b>Man:</b> "Tell me about it! I can barely function."</p>
          </div>
          <div class="qtext">22. What does the man mean?</div>
          <div class="opt" data-i="0">He wants her to explain more.</div>
          <div class="opt" data-i="1">He strongly agrees.</div>
          <div class="opt" data-i="2">He disagrees.</div>
          <div class="opt" data-i="3">He didn't understand her.</div>
          <div class="explain">"Tell me about it!" adalah ungkapan setuju kuat, bukan permintaan penjelasan lebih lanjut.</div>
        </div>

        <div class="q" data-correct="0" data-topic="Listening - functional expression (suggestion)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Suggestion</div>
          <button class="audio-btn" data-target="sd-passage-23">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-23">
            <p data-speaker="woman"><b>Woman:</b> "I can't seem to focus at work lately."</p>
            <p data-speaker="man"><b>Man:</b> "Why don't you try taking short walks between tasks?"</p>
          </div>
          <div class="qtext">23. What does the man suggest?</div>
          <div class="opt" data-i="0">Taking short walks between tasks</div>
          <div class="opt" data-i="1">Quitting her job</div>
          <div class="opt" data-i="2">Working longer hours</div>
          <div class="opt" data-i="3">Ignoring the problem</div>
          <div class="explain">"Why don't you...?" adalah pola untuk memberi saran &mdash; sarannya persis apa yang disebut setelahnya.</div>
        </div>

        <div class="q" data-correct="2" data-topic="Listening - functional expression (uncertainty)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Uncertainty</div>
          <button class="audio-btn" data-target="sd-passage-24">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-24">
            <p data-speaker="man"><b>Man:</b> "Do you think the flight will be delayed?"</p>
            <p data-speaker="woman"><b>Woman:</b> "It's hard to say at this point."</p>
          </div>
          <div class="qtext">24. What does the woman mean?</div>
          <div class="opt" data-i="0">She's certain it will be delayed.</div>
          <div class="opt" data-i="1">She's certain it won't be delayed.</div>
          <div class="opt" data-i="2">She doesn't know yet.</div>
          <div class="opt" data-i="3">She already checked and confirmed.</div>
          <div class="explain">"It's hard to say" berarti belum bisa dipastikan / belum tahu.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - functional expression (surprise)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Surprise</div>
          <button class="audio-btn" data-target="sd-passage-25">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-25">
            <p data-speaker="man"><b>Man:</b> "I just found out I got the scholarship."</p>
            <p data-speaker="woman"><b>Woman:</b> "No kidding! That's amazing news."</p>
          </div>
          <div class="qtext">25. What does the woman's response show?</div>
          <div class="opt" data-i="0">She doesn't believe him.</div>
          <div class="opt" data-i="1">She's surprised and happy for him.</div>
          <div class="opt" data-i="2">She's annoyed by the news.</div>
          <div class="opt" data-i="3">She already knew about it.</div>
          <div class="explain">"No kidding!" mengekspresikan keterkejutan yang menyenangkan, bukan ketidakpercayaan.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - idiomatic (two-part verb)" data-section="listening">
          <div class="qtag">Idiomatic Expression &mdash; Two-Part Verb</div>
          <button class="audio-btn" data-target="sd-passage-26">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-26">
            <p data-speaker="man"><b>Man:</b> "The invoice amount seems wrong."</p>
            <p data-speaker="woman"><b>Woman:</b> "I'll look into it right away."</p>
          </div>
          <div class="qtext">26. What will the woman do?</div>
          <div class="opt" data-i="0">Ignore it</div>
          <div class="opt" data-i="1">Investigate it</div>
          <div class="opt" data-i="2">Pay it immediately without checking</div>
          <div class="opt" data-i="3">Delete it</div>
          <div class="explain">"Look into" berarti menyelidiki / memeriksa lebih lanjut.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - idiomatic (three-part verb)" data-section="listening">
          <div class="qtag">Idiomatic Expression &mdash; Three-Part Verb</div>
          <button class="audio-btn" data-target="sd-passage-27">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-27">
            <p data-speaker="woman"><b>Woman:</b> "Did the team find a solution?"</p>
            <p data-speaker="man"><b>Man:</b> "Yes, they finally came up with a plan."</p>
          </div>
          <div class="qtext">27. What did the team do?</div>
          <div class="opt" data-i="0">Rejected every plan</div>
          <div class="opt" data-i="1">Devised/created a plan</div>
          <div class="opt" data-i="2">Copied someone else's plan</div>
          <div class="opt" data-i="3">Forgot about the plan</div>
          <div class="explain">"Come up with" berarti menemukan / menghasilkan (ide, rencana, solusi).</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - idiomatic (everyday idiom)" data-section="listening">
          <div class="qtag">Idiomatic Expression &mdash; Everyday Idiom</div>
          <button class="audio-btn" data-target="sd-passage-28">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-28">
            <p data-speaker="woman"><b>Woman:</b> "You look tired today."</p>
            <p data-speaker="man"><b>Man:</b> "Yeah, I've been feeling a bit under the weather."</p>
          </div>
          <div class="qtext">28. What does the man mean?</div>
          <div class="opt" data-i="0">He's been enjoying the weather.</div>
          <div class="opt" data-i="1">He feels slightly sick.</div>
          <div class="opt" data-i="2">He's been outside all day.</div>
          <div class="opt" data-i="3">He's very energetic today.</div>
          <div class="explain">"Under the weather" berarti merasa kurang sehat / agak sakit.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - functional expression (agreement)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Agreement</div>
          <button class="audio-btn" data-target="sd-passage-29">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-29">
            <p data-speaker="woman"><b>Woman:</b> "Should we reschedule the meeting?"</p>
            <p data-speaker="man"><b>Man:</b> "Absolutely, that makes more sense."</p>
          </div>
          <div class="qtext">29. What does the man mean?</div>
          <div class="opt" data-i="0">He disagrees with rescheduling.</div>
          <div class="opt" data-i="1">He fully agrees with rescheduling.</div>
          <div class="opt" data-i="2">He's unsure what to do.</div>
          <div class="opt" data-i="3">He wants to cancel the meeting entirely.</div>
          <div class="explain">"Absolutely" adalah ungkapan setuju penuh / sangat setuju.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - structures (passive paraphrase)" data-section="listening">
          <div class="qtag">Structures &mdash; Passive Voice Paraphrase</div>
          <button class="audio-btn" data-target="sd-passage-30">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-30">
            <p data-speaker="woman"><b>Woman:</b> "The manager postponed the launch until next month."</p>
            <p data-speaker="man"><b>Man:</b> "Ah, that explains the new timeline."</p>
          </div>
          <div class="qtext">30. What happened to the launch?</div>
          <div class="opt" data-i="0">It was cancelled.</div>
          <div class="opt" data-i="1">It was postponed.</div>
          <div class="opt" data-i="2">It happened earlier than planned.</div>
          <div class="opt" data-i="3">It stayed on the same schedule.</div>
          <div class="explain">"The manager postponed the launch" diparafrasekan menjadi "it was postponed" dalam bentuk pasif.</div>
        </div>

        <div class="section-label" style="margin-top:26px;">Part B &middot; Long Conversations (2 percakapan &middot; 8 soal)</div>

        <div class="section-label" style="margin-top:14px; background:transparent; color:var(--muted); text-transform:none; letter-spacing:0;">Conversation 1</div>
        <button class="audio-btn" id="audio-btn-1" data-target="passage-1">&#9658; Play audio</button>
        <div class="passage" id="passage-1">
          <p data-speaker="woman"><b>Woman:</b> "I still haven't heard back about the internship I applied for. It's been almost three weeks."</p>
          <p data-speaker="man"><b>Man:</b> "Three weeks isn't unusual for that department. Did you send a follow-up email?"</p>
          <p data-speaker="woman"><b>Woman:</b> "Not yet. I didn't want to seem impatient."</p>
          <p data-speaker="man"><b>Man:</b> "Honestly, a polite follow-up after two weeks is expected. It shows you're still interested, not that you're impatient."</p>
          <p data-speaker="woman"><b>Woman:</b> "That's good to know. What should I even say in the email?"</p>
          <p data-speaker="man"><b>Man:</b> "Just keep it short &mdash; thank them for the opportunity, mention you're still very interested, and ask if there's any update."</p>
          <p data-speaker="woman"><b>Woman:</b> "That sounds much less awkward than I imagined. I'll send it today."</p>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - main topic" data-section="listening">
          <div class="qtag">Main Topic</div>
          <div class="qtext">31. What are the man and woman mainly discussing?</div>
          <div class="opt" data-i="0">How to prepare for a job interview</div>
          <div class="opt" data-i="1">How to follow up on an internship application</div>
          <div class="opt" data-i="2">How to write a resignation letter</div>
          <div class="opt" data-i="3">How to apply for a new internship</div>
          <div class="explain">Topik utama percakapan adalah cara mengirim follow-up untuk lamaran internship yang belum ada kabar.</div>
        </div>

        <div class="q" data-correct="0" data-topic="Listening - detail" data-section="listening">
          <div class="qtag">Specific Detail</div>
          <div class="qtext">32. Why hasn't the woman followed up yet?</div>
          <div class="opt" data-i="0">She was worried it would seem impatient</div>
          <div class="opt" data-i="1">She forgot the deadline</div>
          <div class="opt" data-i="2">She was told not to contact them</div>
          <div class="opt" data-i="3">She already withdrew her application</div>
          <div class="explain">Dia menyatakan langsung, "I didn't want to seem impatient."</div>

          <p data-speaker="man"><i>Professor (Intro to Economics):</i> "Let's briefly cover opportunity cost. Every time you choose one option, you give up the next-best alternative you could have chosen instead. That forgone alternative &mdash; not the money you spent &mdash; is the real economic cost of your decision. For example, if you spend a Saturday studying instead of working a shift, the opportunity cost isn't just the textbook you bought; it's the wages you didn't earn that day."</p>
          <p data-speaker="man">"Students often confuse opportunity cost with monetary cost, but they're not the same thing. You could make a decision that costs no money at all and still carry a high opportunity cost, simply because the time or resource used could have gone toward something more valuable."</p>
          <p data-speaker="man">"Before next class, please read chapter four, which applies this concept to real business decisions &mdash; I'll ask you to identify the opportunity cost in each case study we discuss."</p>

        <div class="section-label" style="margin-top:0px;">Passage 1 of 5 &middot; 10 soal</div>
        <h3 class="rc-title">Coral Reefs: Underwater Cities</h3>
        <div class="rc-passage">
          <p data-para="1"><span class="para-no">1.</span> Coral reefs are among the most biologically diverse ecosystems on Earth, often described as the &quot;rainforests of the sea.&quot; Despite covering less than one percent of the ocean floor, they provide habitat for roughly twenty-five percent of all known marine species. A reef is built gradually by colonies of tiny animals called coral polyps, which secrete calcium carbonate to form hard, cup-shaped skeletons. As successive generations of polyps grow atop the remains of earlier ones, these skeletons accumulate into the massive limestone structures recognized as reefs.</p>
          <p data-para="2"><span class="para-no">2.</span> Most reef-building corals depend on a mutualistic relationship with microscopic algae called zooxanthellae, which live within the polyps' tissues. Through photosynthesis, the algae supply the coral with nutrients and oxygen, while the coral provides the algae with a protected environment and access to sunlight. This partnership is so essential that when environmental stress, such as elevated water temperature, causes corals to expel their zooxanthellae, the corals turn pale, a phenomenon known as coral bleaching. Prolonged bleaching can starve and eventually kill the coral colony.</p>
          <p data-para="3"><span class="para-no">3.</span> Charles Darwin was among the first to classify reefs according to their shape and position relative to land, proposing three principal types: fringing reefs, which grow directly along a coastline; barrier reefs, which are separated from the shore by a lagoon; and atolls, ring-shaped reefs that encircle a central lagoon where an island has subsided beneath the sea. Darwin's subsidence theory, formulated without the benefit of modern instruments, was later confirmed by twentieth-century drilling studies that found volcanic rock beneath layers of coral limestone precisely where his model predicted.</p>
          <p data-para="4"><span class="para-no">4.</span> Beyond their ecological significance, reefs provide practical benefits to coastal communities. Their complex structures dissipate wave energy, reducing coastline erosion and protecting shorelines during storms. They also underpin local fishing economies and attract tourism revenue. Nevertheless, reefs face mounting threats from rising sea temperatures, pollution, and ocean acidification, which impairs corals' ability to build their calcium carbonate skeletons. In response, marine biologists and policymakers have established protected reserves and coral restoration programs, though scientists caution that reversing large-scale reef decline will require significant reductions in global carbon emissions.</p>
        </div>

          <div class="explain">Seluruh paragraf membahas bagaimana reef terbentuk, hubungan simbiosis dengan zooxanthellae, klasifikasi Darwin, dan ancaman terhadap reef -- bukan hanya satu sub-topik.</div>
        </div>

        <h3 class="rc-title">The Transcontinental Railroad</h3>
        <div class="rc-passage">
          <p data-para="1"><span class="para-no">1.</span> Before 1869, travel between the eastern and western United States required months by wagon or a hazardous sea voyage around South America. Congress addressed this problem by passing the Pacific Railroad Act of 1862, which authorized the construction of a continuous rail line connecting Iowa to California. Two companies, the Union Pacific and the Central Pacific, were commissioned to build the route from opposite directions, meeting somewhere in the middle.</p>
          <p data-para="2"><span class="para-no">2.</span> The Union Pacific began laying track westward from Omaha, Nebraska, across relatively flat terrain, while the Central Pacific pushed eastward from Sacramento, California, confronting the formidable granite peaks of the Sierra Nevada. To blast tunnels through solid rock, the Central Pacific relied heavily on Chinese immigrant laborers, who eventually made up roughly ninety percent of its workforce. These workers endured extreme conditions, including avalanches and long winters spent working inside snow tunnels.</p>
          <p data-para="3"><span class="para-no">3.</span> On May 10, 1869, the two lines were joined at Promontory Summit, Utah, an event marked by the driving of a ceremonial golden spike. The completed railroad reduced the journey across the continent from several months to about one week, transforming the movement of goods, people, and information. Telegraph lines running alongside the tracks meant that news could travel from coast to coast almost instantly.</p>
          <p data-para="4"><span class="para-no">4.</span> The railroad's economic consequences were profound. It opened vast new markets for eastern manufacturers and western agricultural producers, spurred the settlement of the Great Plains, and accelerated the decline of the bison herds that Plains Indigenous nations depended on for survival. Historians continue to debate whether the railroad's benefits, chiefly economic integration and westward expansion, outweighed the displacement it caused to Indigenous communities.</p>
        </div>

          <div class="explain">Bacaan menjelaskan latar belakang, proses pembangunan, penyelesaian, dan dampak dari rel kereta transkontinental secara keseluruhan.</div>

        <h3 class="rc-title">Memory and the Role of Sleep</h3>
        <div class="rc-passage">
          <p data-para="1"><span class="para-no">1.</span> Cognitive scientists have long recognized that sleep plays an active role in learning, not merely a period of rest following it. During the day, the brain continuously acquires new information, but that information initially exists in a fragile, easily disrupted state. Sleep, researchers now believe, provides a critical window during which the brain reorganizes and strengthens these fragile memory traces, a process known as consolidation.</p>
          <p data-para="2"><span class="para-no">2.</span> Much of this consolidation appears to occur during slow-wave sleep, the deep stage characterized by synchronized, low-frequency brain activity. Studies using electroencephalography (EEG) have shown that the hippocampus, a brain structure essential for forming new memories, reactivates patterns of neural firing that occurred during earlier waking experiences. This replay is thought to gradually transfer memories from the hippocampus to the cortex, where they can be stored more permanently and integrated with existing knowledge.</p>
          <p data-para="3"><span class="para-no">3.</span> Rapid eye movement (REM) sleep, by contrast, has been linked less to factual memory and more to procedural and emotional memory, such as the consolidation of motor skills and the processing of emotionally charged experiences. Some researchers propose that dreaming during REM sleep may reflect the brain's attempt to make sense of recent emotional events by connecting them to unrelated memories stored previously.</p>
          <p data-para="4"><span class="para-no">4.</span> These findings carry practical implications. Experiments have demonstrated that participants deprived of sleep after learning a task perform worse on tests of that task the following day compared with participants who slept normally, even when both groups receive identical instruction. This has led some educators and sleep researchers to argue that adequate sleep, rather than additional study time alone, may be one of the more effective tools for improving retention.</p>
        </div>

          <div class="explain">Seluruh bacaan berfokus pada bagaimana berbagai tahap tidur berperan dalam menguatkan memori (konsolidasi).</div>

        <h3 class="rc-title">The Rise of Cities in Ancient Mesopotamia</h3>
        <div class="rc-passage">
          <p data-para="1"><span class="para-no">1.</span> Roughly six thousand years ago, small farming villages in the fertile plains between the Tigris and Euphrates rivers began growing into a new kind of settlement: the city. Mesopotamia, often called the cradle of urban civilization, was home to some of the earliest cities in human history, including Uruk, which by 3200 BCE may have housed as many as forty thousand residents, an extraordinary population for its time.</p>
          <p data-para="2"><span class="para-no">2.</span> Several factors converged to make this transformation possible. The rivers deposited nutrient-rich silt across the surrounding floodplain, and the development of irrigation canals allowed farmers to produce agricultural surpluses well beyond what a single family required. This surplus freed a portion of the population from farming altogether, enabling the emergence of specialized occupations such as priests, artisans, traders, and administrators, an economic diversification that villages had rarely supported.</p>
          <p data-para="3"><span class="para-no">3.</span> Managing surplus grain, coordinating irrigation labor, and settling disputes among a growing population required new administrative tools. It was in this context that Mesopotamian scribes developed cuneiform, one of the earliest writing systems, initially used mainly for record-keeping, such as tracking grain shipments and tax obligations, rather than for literature or personal correspondence.</p>
          <p data-para="4"><span class="para-no">4.</span> As cities expanded, they also became centers of religious and political authority. Massive temple complexes, known as ziggurats, dominated city skylines and served as both places of worship and hubs of economic redistribution, since temples often controlled significant stores of grain and land. Kingship gradually emerged from this religious framework, with rulers claiming divine sanction to justify their authority over increasingly large and complex urban populations.</p>
        </div>

        <h3 class="rc-title">Bird Migration and Magnetic Orientation</h3>
        <div class="rc-passage">
          <p data-para="1"><span class="para-no">1.</span> Each year, billions of birds undertake journeys spanning thousands of kilometers between breeding and wintering grounds, often navigating with a precision that has puzzled scientists for decades. Some species, such as the Arctic tern, travel from pole to pole annually, while others cross open ocean for days without landmarks to guide them. Understanding how birds accomplish this feat of navigation has become one of the more compelling questions in animal behavior research.</p>
          <p data-para="2"><span class="para-no">2.</span> Researchers have identified multiple cues that migratory birds appear to rely on, including the position of the sun, patterns of polarized light, and the arrangement of stars in the night sky. Young birds making their first migration, having never seen the route before, seem to inherit at least a partial genetic template for direction and distance, which is later refined through experience on subsequent journeys.</p>
          <p data-para="3"><span class="para-no">3.</span> Perhaps the most extensively studied cue, however, is the Earth's magnetic field. Experiments conducted in specially designed cages have shown that birds can detect both the direction and the intensity of magnetic fields, using this information as an internal compass. One leading hypothesis proposes that light-sensitive proteins called cryptochromes, located in birds' eyes, allow them to perceive magnetic fields visually, effectively letting birds &quot;see&quot; magnetic north as a pattern overlaid on their normal vision.</p>
          <p data-para="4"><span class="para-no">4.</span> Despite decades of research, no single explanation fully accounts for migratory navigation, and most scientists now agree that birds likely integrate several of these systems simultaneously, cross-checking one cue against another to correct for error. This redundancy may explain why migratory birds can still navigate successfully even when a single cue, such as visibility of the stars on a cloudy night, is temporarily unavailable.</p>
