<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEFL ITP Focus Drill</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body style="margin:0;">
<div id="itp-root"></div>
<style>
#itp-root {
  --bg: #F0F7F0;
  --bg-card: #FFFFFF;
  --forest: #1B3A2B;
  --forest-deep: #12281D;
  --green: #2F9E52;
  --green-dark: #1F7A3D;
  --green-tint: #E6F5EA;
  --ink: #16241C;
  --ink-soft: #3A4A3E;
  --muted: #64756A;
  --red: #B33A2E;
  --red-tint: #FBE3DF;
  --line: #D6E6D9;
  font-family: 'Nunito', 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
  font-size: 16px;
  color: var(--ink);
  background: var(--bg);
}
#itp-root * { box-sizing: border-box; }
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap');

#itp-root .wrap { position: relative; border-radius: 22px; overflow: hidden; box-shadow: 0 8px 24px rgba(18,40,29,0.14); }
#itp-root .user-bar {
  position: absolute; top: 18px; right: 20px; display: flex; align-items: center; gap: 10px;
  font-size: 11px; color: #D8F5DF; z-index: 20;
}
#itp-root .user-bar button {
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25); color: #fff;
  border-radius: 999px; padding: 4px 12px; font-size: 11px; font-weight: 700; cursor: pointer;
}
#itp-root .masthead {
  background: linear-gradient(160deg, var(--forest) 0%, var(--forest-deep) 100%);
  color: #FFFFFF;
  padding: 24px 24px 20px;
  position: relative;
}
#itp-root .masthead h1 { font-weight: 800; font-size: 24px; margin: 0 0 4px; letter-spacing: -0.3px; }
#itp-root .masthead .sub { font-size: 13px; letter-spacing: 0.2px; color: #BFE3CB; font-weight: 600; }
#itp-root .stamp {
  position: absolute; top: 20px; right: 20px;
  font-size: 11px; font-weight: 700;
  padding: 6px 12px; border-radius: 999px;
  background: rgba(255,255,255,0.14); color: #D8F5DF;
  border: 1px solid rgba(255,255,255,0.25);
}
/* Mobile: stamp overlap fix */
@media (max-width: 480px) {
  #itp-root .stamp { display: none; }
  #itp-root .user-bar {
    position: static !important;
    background: rgba(0,0,0,0.18);
    padding: 8px 14px 6px;
    margin-bottom: 2px;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 12px;
  }
}

#itp-root .tabs {
  display: flex; flex-wrap: wrap; gap: 6px;
  background: var(--bg-card);
  padding: 10px 14px;
  border-bottom: 1px solid var(--line);
}
#itp-root .tab {
  flex: 1 1 auto; min-width: 100px; text-align: center;
  padding: 10px 10px; font-size: 12.5px; font-weight: 700;
  letter-spacing: 0.2px; cursor: pointer; color: var(--muted);
  border-radius: 999px; border: 1.5px solid transparent;
}
#itp-root .tab.active { background: var(--green); color: #FFFFFF; box-shadow: 0 3px 10px rgba(47,158,82,0.35); }
#itp-root .tab:hover:not(.active) { background: var(--green-tint); color: var(--green-dark); }

#itp-root .panel { display: none; padding: 20px 20px 26px; background: var(--bg); }
#itp-root .panel.active { display: block; }
#itp-root h2 { font-weight: 800; font-size: 20px; margin: 0 0 10px; color: var(--forest); }
#itp-root .section-label {
  display: inline-block; font-size: 11.5px; font-weight: 800; color: var(--green-dark);
  letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 8px;
  background: var(--green-tint); padding: 4px 10px; border-radius: 999px;
}
#itp-root .hint {
  font-size: 14.5px; line-height: 1.55; color: var(--ink-soft);
  background: var(--bg-card); border: 1.5px solid var(--line); border-left: 5px solid var(--green);
  padding: 12px 14px; margin: 10px 0 18px; border-radius: 12px;
}

#itp-root .q {
  margin-bottom: 16px; background: var(--bg-card); border: 1.5px solid var(--line);
  border-radius: 16px; padding: 16px 16px 14px;
}
#itp-root .qtag {
  display: inline-block; font-size: 11px; font-weight: 800; color: var(--green-dark);
  text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px;
  background: var(--green-tint); padding: 3px 9px; border-radius: 999px;
}
#itp-root .qtext { font-weight: 700; margin-bottom: 12px; font-size: 16.5px; line-height: 1.5; color: var(--forest); }
#itp-root .qtext .blank { display: inline-block; min-width: 60px; border-bottom: 2px solid var(--ink); }
#itp-root .opt {
  display: block; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 12px;
  margin-bottom: 8px; cursor: pointer; font-size: 15.5px; font-weight: 600; background: #FFFFFF;
}
#itp-root .opt:hover { border-color: var(--green); background: var(--green-tint); }
#itp-root .opt.correct { border-color: var(--green); background: var(--green-tint); color: var(--green-dark); font-weight: 800; }
#itp-root .opt.incorrect { border-color: var(--red); background: var(--red-tint); color: var(--red); }
#itp-root .opt.disabled { cursor: default; }
#itp-root .explain { font-size: 14px; line-height: 1.5; color: var(--ink-soft); margin-top: 8px; display: none; background: var(--bg); border-radius: 10px; padding: 10px 12px; }
#itp-root .explain.show { display: block; }

#itp-root .we-sentence { font-size: 16.5px; line-height: 2.3; margin-bottom: 4px; }
#itp-root .seg { padding: 3px 5px; border-bottom: 2px dotted var(--muted); cursor: pointer; border-radius: 4px; }
#itp-root .seg:hover { background: var(--green-tint); }
#itp-root .seg.correct { border-bottom-color: var(--green); background: var(--green-tint); font-weight: 800; }
#itp-root .seg.incorrect { border-bottom-color: var(--red); background: var(--red-tint); }
#itp-root .seg.disabled { cursor: default; }

#itp-root .btn {
  font-size: 14.5px; letter-spacing: 0.2px; text-transform: none;
  background: var(--green); color: #FFFFFF; border: none;
  padding: 13px 22px; border-radius: 999px; cursor: pointer; font-weight: 800;
  margin-top: 6px; box-shadow: 0 4px 12px rgba(47,158,82,0.3);
}
#itp-root .btn:hover { background: var(--green-dark); }
#itp-root .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

#itp-root .passage {
  background: var(--bg-card); border: 1.5px solid var(--line); border-left: 5px solid var(--green);
  border-radius: 14px; padding: 16px 18px; font-size: 16px; line-height: 1.7; margin-bottom: 16px;
}
#itp-root .passage p { margin: 0 0 10px; }
#itp-root .passage p:last-child { margin-bottom: 0; }

#itp-root .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
#itp-root .summary-card { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 15px; background: var(--bg-card); }
#itp-root .summary-card .k { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; }
#itp-root .summary-card .v { font-size: 23px; font-weight: 800; margin-top: 3px; color: var(--forest); }
#itp-root .weak-list { margin-top: 16px; }
#itp-root .weak-item {
  display: flex; justify-content: space-between; align-items: center; padding: 11px 14px;
  border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 8px; font-size: 14.5px;
  font-weight: 600; background: var(--bg-card);
}
#itp-root .weak-item .bar-bg { flex: 1; margin: 0 12px; background: var(--green-tint); border-radius: 6px; height: 9px; align-self: center; overflow: hidden; }
#itp-root .weak-item .bar-fill { height: 100%; background: var(--green); }
#itp-root .weak-item.low .bar-fill { background: var(--red); }
#itp-root .footnote { font-size: 12.5px; line-height: 1.5; color: var(--muted); margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
#itp-root .progress-bar-bg { height: 14px; border-radius: 8px; overflow: hidden; background: var(--green-tint); }
#itp-root .progress-bar-fill { height: 100%; background: var(--green); transition: width 0.3s ease; }
#itp-root .target-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
#itp-root .target-row input[type="number"] {
  width: 68px; padding: 9px 10px; border: 1.5px solid var(--line); border-radius: 10px;
  font-size: 15px; background: #FFFFFF; font-weight: 700; text-align: center;
}
#itp-root .btn.ghost { background: #FFFFFF; color: var(--green-dark); border: 1.5px solid var(--green); box-shadow: none; }
#itp-root .btn.ghost:hover { background: var(--green-tint); }
#itp-root .gen-status { font-size: 13.5px; color: var(--ink-soft); margin-top: 10px; }
#itp-root .streak-badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800;
  color: #B85C1E; padding: 7px 14px; border-radius: 999px; margin-bottom: 16px;
  background: #FDECD8; border: 1.5px solid #F3C892;
}

#itp-root .ring-wrap { display: flex; justify-content: center; margin-bottom: 6px; }
#itp-root .ring-label { text-align: center; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); margin-bottom: 16px; }
#itp-root .ring-center-pct { font-size: 26px; font-weight: 800; fill: var(--forest); }
#itp-root .ring-center-sub { font-size: 11px; font-weight: 700; fill: var(--muted); }

#itp-root .chat-log { max-height: 340px; overflow-y: auto; margin-bottom: 14px; }
#itp-root .chat-msg { margin-bottom: 10px; padding: 12px 15px; border-radius: 16px; font-size: 15px; line-height: 1.55; }
#itp-root .chat-msg.user { background: var(--forest); color: #FFFFFF; margin-left: 18%; border-bottom-right-radius: 4px; }
#itp-root .chat-msg.assistant { background: var(--bg-card); border: 1.5px solid var(--line); margin-right: 8%; border-bottom-left-radius: 4px; }
#itp-root .chat-input-row { display: flex; gap: 8px; }
#itp-root .chat-input-row textarea {
  flex: 1; min-height: 54px; font-family: inherit; font-size: 15px; padding: 12px 14px;
  border: 1.5px solid var(--line); border-radius: 16px; background: #FFFFFF; resize: vertical;
}
#itp-root .chat-suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
#itp-root .chat-suggestion {
  font-size: 12.5px; font-weight: 700; border: 1.5px solid var(--line); border-radius: 999px;
  padding: 7px 13px; cursor: pointer; color: var(--ink-soft); background: var(--bg-card);
}
#itp-root .chat-suggestion:hover { border-color: var(--green); color: var(--green-dark); background: var(--green-tint); }

#itp-root .flashcard {
  border: 1.5px solid var(--line); border-radius: 20px; background: var(--bg-card);
  padding: 32px 24px; text-align: center; min-height: 140px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; margin-bottom: 16px; box-shadow: 0 6px 18px rgba(18,40,29,0.08);
}
#itp-root .flashcard .word { font-size: 25px; font-weight: 800; color: var(--forest); }
#itp-root .flashcard .pos { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-top: 4px; }
#itp-root .flashcard .def { font-size: 15.5px; margin-top: 14px; color: var(--ink); display: none; line-height: 1.55; }
#itp-root .flashcard .ex { font-size: 13.5px; margin-top: 8px; color: var(--muted); font-style: italic; display: none; }
#itp-root .flashcard.flipped .def, #itp-root .flashcard.flipped .ex { display: block; }
#itp-root .flashcard .tap-hint {
  font-size: 11.5px; font-weight: 700; color: var(--green-dark); margin-top: 14px;
  text-transform: uppercase; letter-spacing: 0.4px; background: var(--green-tint);
  padding: 4px 10px; border-radius: 999px;
}
#itp-root .rating-row { display: flex; gap: 8px; justify-content: center; }
#itp-root .rating-btn {
  flex: 1; max-width: 130px; padding: 12px 8px; border-radius: 999px; border: 1.5px solid var(--line);
  font-size: 12.5px; font-weight: 800; text-transform: uppercase; cursor: pointer; background: #FFFFFF;
}
#itp-root .rating-btn.again { border-color: var(--red); color: var(--red); }
#itp-root .rating-btn.good { border-color: var(--green); color: var(--green-dark); }
#itp-root .rating-btn.easy { border-color: #2E7D9E; color: #2E7D9E; }
#itp-root .rating-btn:hover { opacity: 0.75; }
#itp-root .vocab-progress { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 14px; text-align: center; }
#itp-root .audio-btn {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800;
  letter-spacing: 0.2px; background: #FFFFFF; color: var(--green-dark); border: 1.5px solid var(--green);
  padding: 9px 15px; border-radius: 999px; cursor: pointer; margin-bottom: 14px;
}
#itp-root .audio-btn:hover { background: var(--green); color: #FFFFFF; }
#itp-root .audio-btn:disabled { opacity: 0.5; cursor: default; }
#itp-root .audio-btn.playing { background: var(--red); border-color: var(--red); color: #FFFFFF; }

#itp-root .fill-tag {
  display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 800;
  color: #8A4B12; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px;
  background: #FDECD8; padding: 3px 9px; border-radius: 999px;
}
#itp-root .fill-input {
  width: 100%; font-family: inherit; font-size: 15.5px; padding: 12px 14px;
  border: 1.5px solid var(--line); border-radius: 12px; background: #FFFFFF;
  resize: vertical; min-height: 44px;
}
#itp-root .fill-input:focus { outline: none; border-color: var(--green); }
#itp-root .fill-input:disabled { background: var(--bg); opacity: 0.85; }
#itp-root .fill-input.correct { border-color: var(--green); background: var(--green-tint); }
#itp-root .fill-input.incorrect { border-color: var(--red); background: var(--red-tint); }
#itp-root .fill-feedback {
  font-size: 13.5px; line-height: 1.5; margin-top: 8px; font-weight: 700; display: none;
}
#itp-root .fill-feedback.show { display: block; }
#itp-root .fill-feedback.correct-fb { color: var(--green-dark); }
#itp-root .fill-feedback.incorrect-fb { color: var(--red); }
#itp-root .grading-banner {
  font-size: 13.5px; font-weight: 700; color: var(--green-dark); background: var(--green-tint);
  border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; display: none;
}
#itp-root .grading-banner.show { display: block; }

/* ---------- Mobile responsiveness ---------- */
@media (max-width: 600px) {
  #itp-root { font-size: 16px; }
  #itp-root .wrap { border-radius: 18px; }
  #itp-root .masthead { padding: 18px 16px 16px; }
  #itp-root .masthead h1 { font-size: 20px; }
  #itp-root .masthead .sub { font-size: 12px; }
  #itp-root .stamp { top: 16px; right: 16px; font-size: 10px; padding: 5px 10px; }

  #itp-root .tabs {
    flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; padding: 8px 10px;
  }
  #itp-root .tabs::-webkit-scrollbar { display: none; }
  #itp-root .tab { flex: 0 0 auto; min-width: auto; white-space: nowrap; padding: 10px 14px; font-size: 12px; }

  #itp-root .panel { padding: 16px 14px 22px; }
  #itp-root h2 { font-size: 18px; }
  #itp-root .q { padding: 14px 14px 12px; border-radius: 14px; }
  #itp-root .qtext { font-size: 15.5px; line-height: 1.6; word-break: break-word; overflow-wrap: break-word; }
  #itp-root .opt { padding: 12px 13px; font-size: 14.5px; border-radius: 12px; word-break: break-word; overflow-wrap: break-word; }
  #itp-root .we-sentence { font-size: 16px; line-height: 2.35; }
  #itp-root .seg { padding: 4px 3px; display: inline-block; }
  #itp-root .passage { padding: 14px 15px; font-size: 14.5px; max-height: 320px; overflow-y: auto; border-radius: 12px; -webkit-overflow-scrolling: touch; }

  #itp-root .btn { width: 100%; padding: 14px 16px; font-size: 15px; }
  #itp-root .btn.ghost { width: auto; }
  #itp-root .target-row .btn.ghost { width: auto; }

  #itp-root .summary-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  #itp-root .summary-card { padding: 12px 13px; border-radius: 12px; }
  #itp-root .summary-card .v { font-size: 20px; }

  #itp-root .weak-item { flex-wrap: wrap; gap: 6px; border-radius: 12px; }
  #itp-root .weak-item .bar-bg { flex-basis: 100%; margin: 4px 0 0; order: 3; }

  #itp-root .target-row { gap: 8px; }
  #itp-root .target-row input[type="number"] { flex: 0 0 60px; }

  #itp-root .chat-msg.user { margin-left: 6%; }
  #itp-root .chat-msg.assistant { margin-right: 4%; }
  #itp-root .chat-input-row { flex-direction: column; }
  #itp-root .chat-input-row .btn { margin-top: 0; }
  #itp-root .chat-suggestions { gap: 6px; }
  #itp-root .chat-suggestion { font-size: 11.5px; padding: 7px 12px; }

  #itp-root .flashcard { padding: 26px 16px; min-height: 120px; border-radius: 18px; }
  #itp-root .flashcard .word { font-size: 22px; }
  #itp-root .rating-row { gap: 6px; }
  #itp-root .rating-btn { padding: 13px 4px; font-size: 11.5px; max-width: none; }

  #itp-root .audio-btn { width: 100%; justify-content: center; }
}

@media (max-width: 380px) {
  #itp-root .masthead h1 { font-size: 18px; }
  #itp-root .tab { padding: 9px 12px; font-size: 11.5px; }
  #itp-root .summary-grid { grid-template-columns: 1fr 1fr; }
}
</style>

<script>
(function(){
  const root = document.getElementById('itp-root');

  // ==== KONFIGURASI BACKEND (Cloudflare Worker) ====
  // Worker yang sama dipakai bersama oleh EduPractice (shell login),
  // TKA SMP, dan UKom Guru.
  const API_BASE = 'https://toefl-ai-proxy.edupractise.workers.dev';

  // ==== AUTH: pakai sesi dari EduPractice (index.html) ====
  // Login sudah ditangani di halaman utama EduPractice. Kalau belum ada
  // sesi tersimpan sama sekali, lempar balik ke halaman login.
  let sessionToken = localStorage.getItem('edu-session-token');
  const isGuest = localStorage.getItem('edu-guest-mode') === '1';
  if (!sessionToken && !isGuest) {
    window.location.replace('index.html?redirect=toefl');
    return;
  }

  function authHeaders() {
    const h = { 'Content-Type': 'application/json' };
    if (sessionToken) h['Authorization'] = 'Bearer ' + sessionToken;
    return h;
  }

  // Helper terpusat untuk semua panggilan AI di app ini.
  // Menggantikan pemanggilan langsung ke api.anthropic.com.
  // opts: { prompt, system, maxTokens, history }
  //   - prompt: string, dipakai kalau tidak ada history (single-turn)
  //   - history: array [{role:'user'|'assistant', content:'...'}] untuk chat multi-turn
  async function callAI(opts) {
    if (!sessionToken) {
      throw new Error('Fitur AI hanya tersedia untuk pengguna yang masuk dengan Google. Silakan Keluar lalu masuk dengan akun Google.');
    }
    let contents;
    if (opts.history && opts.history.length) {
      contents = opts.history.map(m => ({
        role: m.role === 'assistant' ? 'model' : 'user',
        parts: [{ text: m.content }]
      }));
    } else {
      contents = [{ role: 'user', parts: [{ text: opts.prompt }] }];
    }
    const res = await fetch(API_BASE + '/ai', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        contents,
        system: opts.system || undefined,
        maxTokens: opts.maxTokens || 2000
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error((data && data.error) || 'AI proxy error');
    // The Worker is expected to return { text: "<string>" }, but some AI backends
    // occasionally hand back structured content (an object/array) instead of a
    // plain string for complex prompts. Always coerce to a string here so every
    // caller (which does .replace/.trim on the result) can't break — if it was
    // already structured JSON, stringifying it round-trips cleanly through the
    // JSON.parse() that callers like generateBonusSet do right after.
    const raw = data.text;
    if (typeof raw === 'string') return raw;
    if (raw === undefined || raw === null) return '';
    try { return JSON.stringify(raw); } catch (e) { return String(raw); }
  }

  // ==== AUTH: pakai sesi dari EduPractice ====
  function logout() {
    localStorage.removeItem('edu-session-token');
    localStorage.removeItem('edu-guest-mode');
    localStorage.removeItem('edu-user-name');
    localStorage.removeItem('edu-user-email');
    window.location.href = 'index.html';
  }

  async function bootstrapAuth() {
    const bar = root.querySelector('#user-bar');
    const label = root.querySelector('#user-email-label');
    if (isGuest) {
      if (label) label.textContent = 'Tamu (progress tersimpan di perangkat ini)';
      if (bar) bar.style.display = 'flex';
    } else {
      try {
        const res = await fetch(API_BASE + '/auth/me', { headers: authHeaders() });
        if (!res.ok) throw new Error('Sesi habis');
        const data = await res.json();
        if (label) label.textContent = (data.user && data.user.email) || '';
        if (bar) bar.style.display = 'flex';
      } catch (e) {
        window.location.replace('index.html?redirect=toefl');
        return;
      }
    }

            <span class="seg" data-i="3">in its entire history.</span>
          </div>
          <div class="explain">Penanda negatif "Never" di awal kalimat memaksa inversion &mdash; seharusnya "has the department faced," bukan urutan normal "the department has faced."</div>
        </div>

        <div class="q" data-topic="Inversion after Only" data-section="structure_written">
          <div class="qtag">Inversion setelah "Only..."</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">Only after the inspection was completed</span>
            <span class="seg" data-i="1">the factory was allowed</span>
            <span class="seg" data-i="2">to resume</span>
            <span class="seg" data-i="3">its normal daily operations.</span>
          </div>
          <div class="explain">Pembuka "Only after..." memaksa inversion pada klausa utama &mdash; seharusnya "was the factory allowed," bukan "the factory was allowed."</div>
        </div>

        <div class="q" data-topic="Inversion after place expression" data-section="structure_written">
          <div class="qtag">Inversion setelah frasa tempat</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">Beside the old library</span>
            <span class="seg" data-i="1">stood was</span>
            <span class="seg" data-i="2">a small fountain</span>
            <span class="seg" data-i="3">that had been there for decades.</span>
          </div>
          <div class="explain">Setelah frasa tempat, polanya cukup Verb + Subject &mdash; seharusnya "stood a small fountain," bukan "stood was" yang menumpuk dua kata kerja.</div>
        </div>

        <div class="q" data-topic="Conditionals" data-section="structure_written">
          <div class="qtag">Conditional Type 3</div>
          <div class="we-sentence" data-correct="2">
            <span class="seg" data-i="0">If the team had communicated</span>
            <span class="seg" data-i="1">more clearly,</span>
            <span class="seg" data-i="2">the project would finished</span>
            <span class="seg" data-i="3">on schedule.</span>
          </div>
          <div class="explain">Klausa hasil pada Conditional Type 3 butuh "would have + past participle" &mdash; seharusnya "would have finished," bukan "would finished."</div>
        </div>

        <div class="q" data-topic="Connectors (coordinate)" data-section="structure_written">
          <div class="qtag">Coordinate Connector &mdash; logika salah</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">The results were statistically significant,</span>
            <span class="seg" data-i="1">so</span>
            <span class="seg" data-i="2">the sample size was too small</span>
            <span class="seg" data-i="3">to draw firm conclusions.</span>
          </div>
          <div class="explain">Kedua klausa saling bertentangan (hasil signifikan vs. sampel terlalu kecil), jadi konektornya seharusnya "but," bukan "so" yang menandakan sebab-akibat.</div>
        </div>

        <div class="q" data-topic="Connectors (cause vs contrast)" data-section="structure_written">
          <div class="qtag">Adverb Connector &mdash; cause vs contrast</div>
          <div class="we-sentence" data-correct="0">
            <span class="seg" data-i="0">Because the new policy reduced processing time,</span>
            <span class="seg" data-i="1">employee complaints</span>
            <span class="seg" data-i="2">have increased significantly</span>
            <span class="seg" data-i="3">since it started.</span>
          </div>
          <div class="explain">Kedua klausa menunjukkan pertentangan yang tak terduga (efisiensi naik, tapi komplain juga naik), jadi konektornya seharusnya "Although," bukan "Because" yang bersifat sebab-akibat.</div>
        </div>

        <div class="q" data-topic="Connectors (redundant although/but)" data-section="structure_written">
          <div class="qtag">Contrast Connector &mdash; konektor ganda</div>
          <div class="we-sentence" data-correct="2">
            <span class="seg" data-i="0">Although the flight was delayed</span>
            <span class="seg" data-i="1">for several hours,</span>
            <span class="seg" data-i="2">but the passengers remained</span>
            <span class="seg" data-i="3">remarkably calm throughout.</span>
          </div>
          <div class="explain">"Although" sudah menandakan kontras, jadi memasangkannya dengan "but" jadi berlebihan &mdash; klausa kedua cukup dimulai "the passengers remained," tanpa "but."</div>
        </div>

        <div class="q" data-topic="Word form (adverb)" data-section="structure_written">
          <div class="qtag">Word form &mdash; adjective vs adverb</div>
          <div class="we-sentence" data-correct="1">
            <span class="seg" data-i="0">The technician completed</span>
            <span class="seg" data-i="1">the repair quick and careful,</span>
            <span class="seg" data-i="2">impressing the entire</span>
            <span class="seg" data-i="3">maintenance team.</span>
          </div>
          <div class="explain">Kata yang menerangkan bagaimana sebuah aksi dilakukan harus berupa adverb &mdash; seharusnya "quickly and carefully," bukan bentuk adjective "quick and careful."</div>
        </div>

        <button class="btn" id="written-check">Check answers</button>
      </div>

      <div class="panel" id="panel-listening">
        <div class="section-label">Section 1 &middot; 35 soal &middot; &plusmn;35 menit &middot; text-based simulation</div>
        <h2>Listening</h2>
        <div class="hint">Klik "Play audio" sekali, dengarkan sambil mencatat, baru jawab &mdash; pada ujian asli audio hanya diputar sekali. Suara otomatis menyesuaikan pembicara: <b>pria = suara laki-laki</b>, <b>wanita = suara perempuan</b> (mengikuti browser yang mendukung Text-to-Speech).</div>

        <div class="section-label" style="margin-top:4px;">Part A &middot; Short Dialogues (15 soal)</div>

        <div class="q" data-correct="1" data-topic="Listening - functional expression (agreement)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Agreement</div>
          <button class="audio-btn" data-target="sd-passage-1">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-1">
            <p data-speaker="woman"><b>Woman:</b> "This traffic today is absolutely unbearable."</p>
            <p data-speaker="man"><b>Man:</b> "I'll say! It took me almost an hour just to get downtown."</p>
          </div>
          <div class="qtext">1. What does the man mean?</div>
          <div class="opt" data-i="0">He disagrees with the woman.</div>
          <div class="opt" data-i="1">He strongly agrees with her.</div>
          <div class="opt" data-i="2">He is asking her to repeat what she said.</div>
          <div class="opt" data-i="3">He didn't hear what she said.</div>
          <div class="explain">"I'll say!" adalah ungkapan setuju yang kuat &mdash; bukan permintaan mengulang.</div>
        </div>

        <div class="q" data-correct="2" data-topic="Listening - functional expression (agreement)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Agreement</div>
          <button class="audio-btn" data-target="sd-passage-2">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-2">
            <p data-speaker="man"><b>Man:</b> "This is definitely the hardest exam we've had all semester."</p>
            <p data-speaker="woman"><b>Woman:</b> "You can say that again!"</p>
          </div>
          <div class="qtext">2. What does the woman mean?</div>
          <div class="opt" data-i="0">She wants him to repeat his sentence.</div>
          <div class="opt" data-i="1">She thinks he's wrong.</div>
          <div class="opt" data-i="2">She completely agrees with him.</div>
          <div class="opt" data-i="3">She didn't understand him.</div>
          <div class="explain">"You can say that again!" adalah ungkapan setuju kuat, BUKAN permintaan untuk mengulang kalimat.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - functional expression (uncertainty)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Uncertainty</div>
          <button class="audio-btn" data-target="sd-passage-3">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-3">
            <p data-speaker="woman"><b>Woman:</b> "Have you decided whether to accept the job offer in Chicago?"</p>
            <p data-speaker="man"><b>Man:</b> "Honestly, I'm of two minds about it."</p>
          </div>
          <div class="qtext">3. What does the man mean?</div>
          <div class="opt" data-i="0">He has already made his decision.</div>
          <div class="opt" data-i="1">He is still undecided.</div>
          <div class="opt" data-i="2">He has two job offers.</div>
          <div class="opt" data-i="3">He rejected the offer.</div>
          <div class="explain">"Of two minds" berarti belum bisa memutuskan / masih ragu.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - functional expression (uncertainty)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Uncertainty</div>
          <button class="audio-btn" data-target="sd-passage-4">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-4">
            <p data-speaker="man"><b>Man:</b> "Why hasn't the professor posted our grades yet?"</p>
            <p data-speaker="woman"><b>Woman:</b> "Your guess is as good as mine."</p>
          </div>
          <div class="qtext">4. What does the woman imply?</div>
          <div class="opt" data-i="0">She knows exactly why.</div>
          <div class="opt" data-i="1">She has no idea either.</div>
          <div class="opt" data-i="2">She thinks the professor forgot.</div>
          <div class="opt" data-i="3">She already asked the professor.</div>
          <div class="explain">"Your guess is as good as mine" = dia juga tidak tahu, sama seperti si penanya.</div>
        </div>

        <div class="q" data-correct="2" data-topic="Listening - functional expression (suggestion)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Suggestion</div>
          <button class="audio-btn" data-target="sd-passage-5">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-5">
            <p data-speaker="woman"><b>Woman:</b> "I've been getting terrible headaches from staring at my screen all day."</p>
            <p data-speaker="man"><b>Man:</b> "You might want to take more breaks and adjust the brightness."</p>
          </div>
          <div class="qtext">5. What does the man suggest?</div>
          <div class="opt" data-i="0">That she see a doctor immediately.</div>
          <div class="opt" data-i="1">That she stop using her computer.</div>
          <div class="opt" data-i="2">That she take breaks and lower the screen brightness.</div>
          <div class="opt" data-i="3">That she buy a new screen.</div>
          <div class="explain">"You might want to..." adalah saran halus &mdash; di sini menyarankan istirahat dan menurunkan kecerahan layar.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - functional expression (surprise)" data-section="listening">
          <div class="qtag">Functional Expression &mdash; Surprise</div>
          <button class="audio-btn" data-target="sd-passage-6">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-6">
            <p data-speaker="man"><b>Man:</b> "Did you hear? The bookstore on campus is closing permanently."</p>
            <p data-speaker="woman"><b>Woman:</b> "You don't say! I had no idea."</p>
          </div>
          <div class="qtext">6. What does the woman's response show?</div>
          <div class="opt" data-i="0">She already knew about it.</div>
          <div class="opt" data-i="1">She is expressing surprise.</div>
          <div class="opt" data-i="2">She doesn't believe him.</div>
          <div class="opt" data-i="3">She is annoyed.</div>
          <div class="explain">"You don't say!" mengekspresikan keterkejutan ringan mendengar informasi baru.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - structures (passive paraphrase)" data-section="listening">
          <div class="qtag">Structures &mdash; Passive Voice Paraphrase</div>
          <button class="audio-btn" data-target="sd-passage-7">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-7">
            <p data-speaker="woman"><b>Woman:</b> "The committee revised the schedule after several complaints."</p>
            <p data-speaker="man"><b>Man:</b> "Oh, so that's why everything changed."</p>
          </div>
          <div class="qtext">7. What happened to the schedule?</div>
          <div class="opt" data-i="0">It was ignored.</div>
          <div class="opt" data-i="1">It was updated.</div>
          <div class="opt" data-i="2">It was cancelled entirely.</div>
          <div class="opt" data-i="3">It stayed the same.</div>
          <div class="explain">"The committee revised the schedule" diparafrasekan menjadi "The schedule was updated" (passive).</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - structures (negative expressions)" data-section="listening">
          <div class="qtag">Structures &mdash; Negative Expressions</div>
          <button class="audio-btn" data-target="sd-passage-8">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-8">
            <p data-speaker="man"><b>Man:</b> "I really think we should invest more in renewable energy research."</p>
            <p data-speaker="woman"><b>Woman:</b> "I couldn't agree more."</p>
          </div>
          <div class="qtext">8. What does the woman mean?</div>
          <div class="opt" data-i="0">She disagrees somewhat.</div>
          <div class="opt" data-i="1">She completely agrees.</div>
          <div class="opt" data-i="2">She is undecided.</div>
          <div class="opt" data-i="3">She agrees more than before, but not fully.</div>
          <div class="explain">"I couldn't agree more" TIDAK bersifat negatif &mdash; artinya setuju sepenuhnya.</div>
        </div>

        <div class="q" data-correct="2" data-topic="Listening - structures (almost negatives)" data-section="listening">
          <div class="qtag">Structures &mdash; Almost Negatives</div>
          <button class="audio-btn" data-target="sd-passage-9">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-9">
            <p data-speaker="woman"><b>Woman:</b> "Did James make it to the meeting on time?"</p>
            <p data-speaker="man"><b>Man:</b> "He barely made it &mdash; he walked in just as it started."</p>
          </div>
          <div class="qtext">9. What does "barely made it" mean?</div>
          <div class="opt" data-i="0">He missed the meeting completely.</div>
          <div class="opt" data-i="1">He arrived very early.</div>
          <div class="opt" data-i="2">He almost didn't make it in time.</div>
          <div class="opt" data-i="3">He was asked to leave.</div>
          <div class="explain">"Barely/hardly made it" = hampir terlambat, tapi tetap datang tepat waktu.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - structures (wishes)" data-section="listening">
          <div class="qtag">Structures &mdash; Wishes</div>
          <button class="audio-btn" data-target="sd-passage-10">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-10">
            <p data-speaker="man"><b>Man:</b> "It's really pouring outside right now."</p>
            <p data-speaker="woman"><b>Woman:</b> "I wish I had brought an umbrella."</p>
          </div>
          <div class="qtext">10. What does the woman imply?</div>
          <div class="opt" data-i="0">She did bring an umbrella.</div>
          <div class="opt" data-i="1">She didn't bring one and now regrets it.</div>
          <div class="opt" data-i="2">She likes walking in the rain.</div>
          <div class="opt" data-i="3">She is asking the man for an umbrella.</div>
          <div class="explain">"I wish I had brought..." menyiratkan dia TIDAK membawa payung dan menyesalinya.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - structures (conditionals)" data-section="listening">
          <div class="qtag">Structures &mdash; Conditionals (Unreal Past)</div>
          <button class="audio-btn" data-target="sd-passage-11">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-11">
            <p data-speaker="woman"><b>Woman:</b> "Why did you go to the party if you had so much homework?"</p>
            <p data-speaker="man"><b>Man:</b> "If I had known about the exam, I wouldn't have gone."</p>
          </div>
          <div class="qtext">11. What does the man imply?</div>
          <div class="opt" data-i="0">He knew about the exam and went anyway.</div>
          <div class="opt" data-i="1">He didn't know about the exam, so he went.</div>
          <div class="opt" data-i="2">He has no homework.</div>
          <div class="opt" data-i="3">He is going to another party.</div>
          <div class="explain">Conditional tipe 3 menyiratkan kebalikan dari yang diucapkan: dia TIDAK tahu soal ujian, makanya dia pergi.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - idiomatic (two-part verb)" data-section="listening">
          <div class="qtag">Idiomatic Expression &mdash; Two-Part Verb</div>
          <button class="audio-btn" data-target="sd-passage-12">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-12">
            <p data-speaker="man"><b>Man:</b> "Have you started working on your research paper yet?"</p>
            <p data-speaker="woman"><b>Woman:</b> "Not yet, I keep putting it off."</p>
          </div>
          <div class="qtext">12. What does the woman mean?</div>
          <div class="opt" data-i="0">She has already finished it.</div>
          <div class="opt" data-i="1">She keeps postponing it.</div>
          <div class="opt" data-i="2">She cancelled the assignment.</div>
          <div class="opt" data-i="3">She rejected the topic.</div>
          <div class="explain">"Put off" berarti menunda.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - idiomatic (three-part verb)" data-section="listening">
          <div class="qtag">Idiomatic Expression &mdash; Three-Part Verb</div>
          <button class="audio-btn" data-target="sd-passage-13">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-13">
            <p data-speaker="woman"><b>Woman:</b> "You look exhausted today."</p>
            <p data-speaker="man"><b>Man:</b> "Yeah, I stayed up all night trying to catch up on my reading."</p>
          </div>
          <div class="qtext">13. What was the man doing?</div>
          <div class="opt" data-i="0">Reducing how much he reads.</div>
          <div class="opt" data-i="1">Getting up to date on reading he had fallen behind on.</div>
          <div class="opt" data-i="2">Quitting his reading class.</div>
          <div class="opt" data-i="3">Reading for the first time.</div>
          <div class="explain">"Catch up on" berarti mengejar ketertinggalan / menyusul sesuatu yang tertunda.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - idiomatic (everyday idiom)" data-section="listening">
          <div class="qtag">Idiomatic Expression &mdash; Everyday Idiom</div>
          <button class="audio-btn" data-target="sd-passage-14">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-14">
            <p data-speaker="man"><b>Man:</b> "Are you going to take the marketing internship or the finance one?"</p>
            <p data-speaker="woman"><b>Woman:</b> "Honestly, I'm still on the fence about it."</p>
          </div>
          <div class="qtext">14. What does the woman mean?</div>
          <div class="opt" data-i="0">She has already chosen.</div>
          <div class="opt" data-i="1">She is undecided.</div>
          <div class="opt" data-i="2">She rejected both offers.</div>
          <div class="opt" data-i="3">She is not eligible for either.</div>
          <div class="explain">"On the fence" berarti belum memutuskan / masih ragu.</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - idiomatic (everyday idiom)" data-section="listening">
          <div class="qtag">Idiomatic Expression &mdash; Everyday Idiom</div>
          <button class="audio-btn" data-target="sd-passage-15">&#9658; Play audio</button>
          <div class="passage" id="sd-passage-15">
            <p data-speaker="woman"><b>Woman:</b> "Are you free to grab dinner tonight?"</p>
            <p data-speaker="man"><b>Man:</b> "I wish, but I really need to hit the books before tomorrow's test."</p>
          </div>
          <div class="qtext">15. What does the man mean he needs to do?</div>
          <div class="opt" data-i="0">Buy some new books.</div>
          <div class="opt" data-i="1">Study hard.</div>
          <div class="opt" data-i="2">Return library books.</div>
          <div class="opt" data-i="3">Take a break from studying.</div>
          <div class="explain">"Hit the books" berarti belajar dengan giat.</div>
        </div>

        <div class="section-label" style="margin-top:26px;">Part B &middot; Long Conversations (2 percakapan &middot; 8 soal)</div>

        <div class="section-label" style="margin-top:14px; background:transparent; color:var(--muted); text-transform:none; letter-spacing:0;">Conversation 1</div>
        <button class="audio-btn" id="audio-btn-1" data-target="passage-1">&#9658; Play audio</button>
        <div class="passage" id="passage-1">
          <p data-speaker="woman"><b>Woman:</b> "I still haven't heard back about the internship I applied for. It's been almost three weeks."</p>
          <p data-speaker="man"><b>Man:</b> "Three weeks isn't unusual for that department. Did you send a follow-up email?"</p>
          <p data-speaker="woman"><b>Woman:</b> "Not yet. I didn't want to seem impatient."</p>
          <p data-speaker="man"><b>Man:</b> "Honestly, a polite follow-up after two weeks is expected. It shows you're still interested, not that you're impatient."</p>
          <p data-speaker="woman"><b>Woman:</b> "That's good to know. What should I even say in the email?"</p>
          <p data-speaker="man"><b>Man:</b> "Just keep it short &mdash; thank them for the opportunity, mention you're still very interested, and ask if there's any update."</p>
          <p data-speaker="woman"><b>Woman:</b> "That sounds much less awkward than I imagined. I'll send it today."</p>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - main topic" data-section="listening">
          <div class="qtag">Main Topic</div>
          <div class="qtext">16. What are the man and woman mainly discussing?</div>
          <div class="opt" data-i="0">How to prepare for a job interview</div>
          <div class="opt" data-i="1">How to follow up on an internship application</div>
          <div class="opt" data-i="2">How to write a resignation letter</div>
          <div class="opt" data-i="3">How to apply for a new internship</div>
          <div class="explain">Topik utama percakapan adalah cara mengirim follow-up untuk lamaran internship yang belum ada kabar.</div>
        </div>

        <div class="q" data-correct="0" data-topic="Listening - detail" data-section="listening">
          <div class="qtag">Specific Detail</div>
          <div class="qtext">17. Why hasn't the woman followed up yet?</div>
          <div class="opt" data-i="0">She was worried it would seem impatient</div>
          <div class="opt" data-i="1">She forgot the deadline</div>
          <div class="opt" data-i="2">She was told not to contact them</div>
          <div class="opt" data-i="3">She already withdrew her application</div>
          <div class="explain">Dia menyatakan langsung, "I didn't want to seem impatient."</div>
        </div>

        <div class="q" data-correct="1" data-topic="Listening - suggestion/advice" data-section="listening">
          <div class="qtag">Suggestion &amp; Advice</div>
          <div class="qtext">18. What does the man imply the woman should do?</div>
          <div class="opt" data-i="0">Withdraw her application</div>
          <div class="opt" data-i="1">Send a follow-up email</div>

  root.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      root.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      root.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      root.querySelector('#panel-' + t.dataset.tab).classList.add('active');
    });
  });

  const topicStats = {}; // topic -> {correct, total}

  function recordTopic(topic, isCorrect) {
    if (!topic) return;
    if (!topicStats[topic]) topicStats[topic] = {correct: 0, total: 0};
    topicStats[topic].total++;
    if (isCorrect) topicStats[topic].correct++;
  }

  function renderWeakSummary() {
    const container = root.querySelector('#weak-summary');
    const topics = Object.keys(topicStats);
    if (topics.length === 0) return;
    container.innerHTML = topics.map(topic => {
      const s = topicStats[topic];
      const pct = Math.round((s.correct / s.total) * 100);
      const low = pct < 60;
      return `<div class="weak-item ${low ? 'low' : ''}">
        <span>${topic}</span>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
        <span>${s.correct}/${s.total}</span>
      </div>`;
    }).join('');
  }

  root.querySelector('#structure-check').addEventListener('click', () => {
    const panel = root.querySelector('#panel-structure');
    let correct = 0, total = 0;
    panel.querySelectorAll('.q').forEach(q => {
      total++;
      const answer = parseInt(q.dataset.correct, 10);
      const selected = q.dataset.selected;
      const topic = q.dataset.topic;
      const isCorrect = selected !== undefined && parseInt(selected,10) === answer;
      if (isCorrect) correct++;
      recordTopic(topic, isCorrect);
      q.querySelectorAll('.opt').forEach(o => {
        o.classList.add('disabled');
        const i = parseInt(o.dataset.i, 10);
        if (i === answer) o.classList.add('correct');
        else if (selected !== undefined && parseInt(selected,10) === i) o.classList.add('incorrect');
      });
      q.querySelector('.explain').classList.add('show');
    });
    root.querySelector('#score-structure').textContent = correct + ' / ' + total;
    root.querySelector('#structure-check').disabled = true;
    renderWeakSummary();

  // ==== PENYIMPANAN PROGRESS ====
  // Login Google -> tersimpan di backend (Cloudflare D1), sinkron lintas device.
  // Mode Tamu -> tersimpan di localStorage browser ini saja.
  const GUEST_PREFIX = 'toefl-guest:';
  window.storage = isGuest ? {
    async get(key, shared) {
      const raw = localStorage.getItem(GUEST_PREFIX + key);
      if (raw === null) throw new Error('Key not found: ' + key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      localStorage.setItem(GUEST_PREFIX + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      localStorage.removeItem(GUEST_PREFIX + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const keys = [];
      const p = GUEST_PREFIX + (prefix || '');
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(p) === 0) keys.push(k.slice(GUEST_PREFIX.length));
      }
      return { keys, prefix, shared: !!shared };
    }
  } : {
    async get(key, shared) {
      const res = await fetch(API_BASE + '/storage/get', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ key, shared: !!shared })
      });
      if (res.status === 404) throw new Error('Key not found: ' + key);
      if (!res.ok) throw new Error('Storage get failed');
      return await res.json(); // { key, value, shared }
    },
    async set(key, value, shared) {
      const res = await fetch(API_BASE + '/storage/set', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ key, value, shared: !!shared })
      });
      if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || 'Storage set failed'); }
      return await res.json();
    },
    async delete(key, shared) {
      const res = await fetch(API_BASE + '/storage/delete', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ key, shared: !!shared })
      });
      if (!res.ok) throw new Error('Storage delete failed');
      return await res.json();
    },
    async list(prefix, shared) {
      const res = await fetch(API_BASE + '/storage/list', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ prefix: prefix || '', shared: !!shared })
      });
      if (!res.ok) throw new Error('Storage list failed');
      return await res.json();
    }
  };

  // Storage backend can occasionally return a transient server error.
  // Retry a couple of times with a short backoff before giving up.
  async function storageSetWithRetry(key, value, shared, attempts) {
    attempts = attempts || 3;
    let lastErr;
    for (let i = 0; i < attempts; i++) {
      try {
        return await window.storage.set(key, value, shared || false);
      } catch (e) {
        lastErr = e;
        if (i < attempts - 1) await sleep(400 * (i + 1));
      }
    }
    throw lastErr;
  }

  window.__toeflProgress = { date: todayStr(), correctToday: 0, target: 10 };

  function renderProgress() {
    const p = window.__toeflProgress;
    const pct = Math.min(100, Math.round((p.correctToday / p.target) * 100));
    const circumference = 389.6;
    const offset = circumference - (pct / 100) * circumference;
    const ring = root.querySelector('#ring-fill');
    if (ring) ring.setAttribute('stroke-dashoffset', offset.toFixed(1));
    const ringPct = root.querySelector('#ring-pct');
    if (ringPct) ringPct.textContent = pct + '%';
    const ringSub = root.querySelector('#ring-sub');
    if (ringSub) ringSub.textContent = p.correctToday + ' / ' + p.target;
    root.querySelector('#target-progress-text').textContent = p.correctToday + ' / ' + p.target + ' correct today';
    root.querySelector('#target-input').value = p.target;
    root.querySelector('#generate-btn').style.display = (p.correctToday >= p.target) ? 'inline-block' : 'none';
  }

  async function saveProgress() {
    try {
      await storageSetWithRetry('toefl-daily-progress', JSON.stringify(window.__toeflProgress), false);
    } catch (e) {
      console.error('Could not save progress', e);
    }
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function buildMCQuestion(q, idx, section) {
    const div = document.createElement('div');
    div.className = 'q';
    div.dataset.correct = q.correctIndex;
    div.dataset.topic = q.topic || '';
    div.dataset.section = section || 'other';
    const opts = (q.options || []).map((o, i) => `<div class="opt" data-i="${i}">${escapeHtml(o)}</div>`).join('');
    div.innerHTML = `<div class="qtag">${escapeHtml(q.topic || '')}</div>
      <div class="qtext">${idx}. ${escapeHtml(q.question)}</div>
      ${opts}
      <div class="explain">${escapeHtml(q.explanation || '')}</div>`;
    return div;
  }

  function buildWrittenQuestion(q, idx, section) {
    const div = document.createElement('div');
    div.className = 'q';
    div.dataset.topic = q.topic || '';
    div.dataset.section = section || 'other';
    const segs = (q.segments || []).map((s, i) => `<span class="seg" data-i="${i}">${escapeHtml(s)}</span>`).join(' ');
    div.innerHTML = `<div class="qtag">${escapeHtml(q.topic || '')}</div>
      <div class="we-sentence" data-correct="${q.correctIndex}">${segs}</div>
      <div class="explain">${escapeHtml(q.explanation || '')}</div>`;
    return div;
  }

  function buildShortAnswerQuestion(q, idx, section, passageId) {
    const div = document.createElement('div');
    div.className = 'q fill-q';
    div.dataset.topic = q.topic || '';
    div.dataset.section = section || 'other';
    div.dataset.accepted = q.acceptedAnswer || '';
    div.dataset.prompt = q.prompt || q.question || '';
    if (passageId) div.dataset.passage = passageId;
    div.innerHTML = `<div class="fill-tag">\u270D\uFE0F Type your own answer</div>
      <div class="qtag">${escapeHtml(q.topic || '')}</div>
      <div class="qtext">${idx}. ${escapeHtml(q.prompt || q.question || '')}</div>
      <textarea class="fill-input" rows="2" placeholder="Type your answer here..."></textarea>
      <div class="fill-feedback"></div>
      <div class="explain">${escapeHtml(q.explanation || '')}</div>`;
    return div;
  }

  function gradeAnyContainer(container) {
    let correct = 0, total = 0;
    const bySection = {};
    container.querySelectorAll('.q').forEach(q => {
      const topic = q.dataset.topic;
      const section = q.dataset.section || 'other';
      if (!bySection[section]) bySection[section] = { correct: 0, total: 0 };
      const optEls = q.querySelectorAll('.opt');
      if (optEls.length) {
        total++;
        const answer = parseInt(q.dataset.correct, 10);
        const selected = q.dataset.selected;
        const isCorrect = selected !== undefined && parseInt(selected, 10) === answer;
        if (isCorrect) correct++;
        bySection[section].total++;
        if (isCorrect) bySection[section].correct++;
        recordTopic(topic, isCorrect);
        optEls.forEach(o => {
          o.classList.add('disabled');
          const i = parseInt(o.dataset.i, 10);
          if (i === answer) o.classList.add('correct');
          else if (selected !== undefined && parseInt(selected, 10) === i) o.classList.add('incorrect');
        });
      } else {
        const sentence = q.querySelector('.we-sentence');
        if (sentence) {
          total++;
          const answer = parseInt(sentence.dataset.correct, 10);
          const selected = sentence.dataset.selected;
          const isCorrect = selected !== undefined && parseInt(selected, 10) === answer;
          if (isCorrect) correct++;
          bySection[section].total++;
          if (isCorrect) bySection[section].correct++;
          recordTopic(topic, isCorrect);
          sentence.classList.add('disabled');
          sentence.querySelectorAll('.seg').forEach(s => {
            s.classList.add('disabled');
            const i = parseInt(s.dataset.i, 10);
            if (i === answer) s.classList.add('correct');
            else if (selected !== undefined && parseInt(selected, 10) === i) s.classList.add('incorrect');
          });
        }
      }
      const exp = q.querySelector('.explain');
      if (exp) exp.classList.add('show');
    });
    return { correct, total, bySection };
  }

  async function gradeShortAnswers(container, banner) {
    const fillEls = Array.from(container.querySelectorAll('.fill-q'));
    if (!fillEls.length) return { correct: 0, total: 0, bySection: {} };

    const items = fillEls.map((el, i) => ({
      index: i,
      topic: el.dataset.topic,
      prompt: el.dataset.prompt,
      acceptedAnswer: el.dataset.accepted,
      userAnswer: (el.querySelector('.fill-input').value || '').trim()
    }));

    if (banner) { banner.textContent = 'Grading your typed answers with AI...'; banner.classList.add('show'); }

    let grades = null;
    try {
      const prompt = `You are grading short-answer responses for a TOEFL ITP practice app. For each item, decide if the student's answer is correct given the question and the reference accepted answer. Be reasonably lenient about minor spelling, capitalization, punctuation, or article/word-order variations, but the core grammar point being tested must be correctly demonstrated. Give brief, encouraging feedback (max 20 words) in each case, mentioning what's right or what to fix.

Items (JSON): ${JSON.stringify(items)}

Return ONLY valid JSON, no markdown fences, no commentary, in exactly this shape: {"grades":[{"index":0,"correct":true,"feedback":"..."}]}`;
      const text = await callAI({ prompt, maxTokens: 1500 });
      const clean = text.replace(/```json|```/g, '').trim();
      grades = JSON.parse(clean).grades;
    } catch (e) {
      console.error('Short-answer grading failed', e);
    }

    if (banner) banner.classList.remove('show');

    let correct = 0, total = fillEls.length;
    const bySection = {};
    fillEls.forEach((el, i) => {
      const section = el.dataset.section || 'other';
      if (!bySection[section]) bySection[section] = { correct: 0, total: 0 };
      bySection[section].total++;
      const g = grades && grades.find(x => x.index === i);
      const input = el.querySelector('.fill-input');
      const fb = el.querySelector('.fill-feedback');
      input.disabled = true;
      let isCorrect = false;
      let feedbackText;
      if (g) {
        isCorrect = !!g.correct;
        feedbackText = g.feedback || (isCorrect ? 'Correct!' : 'Not quite.');
      } else {
        feedbackText = 'Could not auto-grade this one — compare with the explanation below.';
      }
      if (isCorrect) { correct++; bySection[section].correct++; input.classList.add('correct'); }
      else if (g) { input.classList.add('incorrect'); }
      fb.textContent = feedbackText;
      fb.classList.add('show', isCorrect ? 'correct-fb' : 'incorrect-fb');
      recordTopic(el.dataset.topic, isCorrect);
      const exp = el.querySelector('.explain');
      if (exp) exp.classList.add('show');
    });
    return { correct, total, bySection };
  }
